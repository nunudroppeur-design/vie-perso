<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B34C4">
<meta name="description" content="Dashboard personnel : budget, dépenses, liste courses, santé, sport, voiture, frigo">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vie Perso">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%231B34C4' width='180' height='180'/><text x='90' y='135' font-size='100' text-anchor='middle' font-family='system-ui'>💰</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%231B34C4' width='180' height='180' rx='40'/><text x='90' y='135' font-size='100' text-anchor='middle' font-family='system-ui'>💰</text></svg>">
<title>Vie Perso</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
:root{
  --outremer:#1B34C4;
  --craie:#F1F2ED;
  --blanc:#FFFFFF;
  --encre:#14181F;
  --gris:#6A7280;
  --gris-clair:#D9DCD6;
  --signal:#F5A300;
  --vert:#0F7F58;
  --rouge:#C0392B;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
  --pad:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--ui);background:var(--craie);color:var(--encre);line-height:1.45;padding-bottom:96px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--outremer);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding:0 var(--pad)}

/* EN-TETE */
.top{padding:18px var(--pad) 12px;max-width:820px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:19px;font-weight:700;letter-spacing:-0.02em}
.top .date{font-family:var(--mono);font-size:12px;color:var(--gris);text-transform:uppercase;letter-spacing:0.06em;white-space:nowrap}

/* NAV PRINCIPALE (domaines) */
.domaines{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.domaines::-webkit-scrollbar{display:none}
.dom{padding:10px 15px;border-radius:12px;background:var(--blanc);color:var(--gris);font-size:13px;font-weight:700;white-space:nowrap;border:1px solid var(--gris-clair);display:flex;align-items:center;gap:7px}
.dom[aria-current="true"]{background:var(--encre);color:#fff;border-color:var(--encre)}
.dom .ic{font-size:15px}
.dom .n{font-family:var(--mono);font-size:11px;opacity:.7}

/* SOUS-ONGLETS (à l'intérieur d'un domaine) */
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:20px;background:var(--blanc);color:var(--gris);font-size:13px;font-weight:600;white-space:nowrap;border:1px solid var(--gris-clair)}
.tab[aria-selected="true"]{background:var(--outremer);color:#fff;border-color:var(--outremer)}
.tab .n{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

/* BANDEAU PROCHAINEMENT (signature, visible sur la vue d'ensemble) */
.board{background:var(--outremer);color:#fff;border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.board-hd{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.18)}
.board-hd span:first-child{font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase}
.board-hd .late{font-family:var(--mono);font-size:11px;background:var(--signal);color:#231A00;padding:2px 7px;border-radius:20px;font-weight:700}
.board-row{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.10);animation:rise .34s cubic-bezier(.2,.7,.3,1) backwards}
.board-row:last-child{border-bottom:none}
.board-row.clic{cursor:pointer}
.board-time{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:-0.02em}
.board-label{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-kind{font-family:var(--mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;opacity:.72}
.board-row.is-late .board-time{color:var(--signal)}
.board-empty{padding:18px 14px;font-size:14px;opacity:.8}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.board-row{animation:none}}

/* SAISIE RAPIDE */
.quick{display:flex;gap:8px;margin-bottom:8px}
.quick input{flex:1;padding:13px 14px;border:1px solid var(--gris-clair);border-radius:var(--r);background:var(--blanc);font-size:16px}
.quick input::placeholder{color:#9AA1A9}
.quick button{padding:0 20px;border-radius:var(--r);background:var(--outremer);color:#fff;font-weight:700;font-size:15px}
.hint{font-size:12px;color:var(--gris);margin-bottom:16px;padding-left:2px}
.hint code{font-family:var(--mono);background:var(--blanc);border:1px solid var(--gris-clair);padding:1px 5px;border-radius:4px;font-size:11px}

/* SECTIONS & CARTES */
.sec{margin-bottom:22px}
.sec-hd{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--gris);padding:0 2px 8px}
.sec-hd .count{font-family:var(--mono);letter-spacing:0}
.sec-hd button{font-size:11px;font-weight:700;letter-spacing:0.06em;color:var(--outremer);text-transform:none}
.sec.alert .sec-hd{color:var(--rouge)}
.card{display:flex;align-items:flex-start;gap:12px;background:var(--blanc);border:1px solid var(--gris-clair);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.card.is-late{border-left:4px solid var(--signal);padding-left:11px}
.card.is-soon{border-left:4px solid var(--outremer);padding-left:11px}
.card.is-done{opacity:.5}
.card.is-done .card-title{text-decoration:line-through}
.check{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--gris-clair);background:var(--blanc);display:grid;place-items:center;margin-top:1px;font-size:13px;color:#fff;line-height:1;transition:background .12s,border-color .12s}
.check[aria-pressed="true"]{background:var(--vert);border-color:var(--vert)}
.card-body{flex:1;min-width:0}
.card-title{font-size:15px;font-weight:600;letter-spacing:-0.01em;word-break:break-word}
.card-meta{font-size:12.5px;color:var(--gris);margin-top:2px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card-meta .mono{font-family:var(--mono);font-size:12px}
.card-meta .late{color:var(--rouge);font-weight:700}
.card-acts{display:flex;gap:2px;flex:0 0 auto}
.icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:15px;color:var(--gris)}
.icon-btn:hover{background:var(--craie)}
.qte{font-family:var(--mono);font-size:12px;font-weight:700;background:var(--craie);border-radius:5px;padding:1px 6px;margin-right:7px}
.compte{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--outremer)}
.prio{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 auto}
.prio-haute{background:var(--rouge)}
.prio-normale{background:var(--signal)}
.prio-basse{background:var(--gris-clair)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{font-size:13px;padding:6px 12px;border-radius:20px;background:var(--blanc);border:1px dashed var(--gris-clair);color:var(--encre);display:inline-flex;align-items:center}
.chip:hover{border-style:solid;border-color:var(--outremer);color:var(--outremer)}
.chip.sugg{border-style:solid;border-color:var(--outremer);color:var(--outremer)}
.chip .mono{font-family:var(--mono);margin-left:6px}
.tag-origine{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid var(--gris-clair);background:var(--craie);color:var(--gris);white-space:nowrap}
.tag-origine:hover{border-color:var(--outremer);color:var(--outremer)}
.chip-th{width:16px;height:16px;border-radius:4px;object-fit:cover;margin-right:6px;flex:0 0 auto}
.thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:0 0 auto;background:var(--gris-clair)}
.empty{background:var(--blanc);border:1px dashed var(--gris-clair);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--gris);font-size:14px}
.empty strong{display:block;color:var(--encre);font-size:15px;margin-bottom:4px}

/* KPI (cartes de synthèse — Santé, Voiture) */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:18px}
.kpi{background:var(--blanc);border:1px solid var(--gris-clair);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-0.02em}
.kpi .l{font-size:11px;color:var(--gris);text-transform:uppercase;letter-spacing:0.08em;margin-top:2px}
.kpi.warn .v{color:var(--signal)}
.kpi.bad .v{color:var(--rouge)}
.kpi.good .v{color:var(--vert)}

/* BARRE OUTIL COURSES / MODE MAGASIN */
.shop-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--encre);color:#fff;border-radius:var(--r);padding:10px 14px;margin-bottom:10px}
.shop-bar span{font-size:13px;font-weight:600}
.shop-bar .grp{display:flex;gap:6px}
.shop-bar button{font-size:12px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:5px 12px}
body.shop .card{padding:16px 14px}
body.shop .check{width:30px;height:30px;font-size:16px}
body.shop .card-title{font-size:17px}
body.shop .card.is-done{display:none}
body.shop .card-acts{display:none}

/* PROGRAMME SPORT : bloc exercice */
.prog-card{background:var(--blanc);border:1px solid var(--gris-clair);border-radius:var(--r);padding:16px;margin-bottom:14px}
.prog-card.is-done-auj{border-color:var(--vert)}
.prog-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.prog-hd h3{font-size:16px;font-weight:700}
.badge-fait{display:inline-block;font-size:11px;font-weight:700;color:var(--vert);background:rgba(15,127,88,.1);border-radius:20px;padding:2px 9px;vertical-align:middle;margin-left:4px}
.prog-meta{font-size:12.5px;color:var(--gris);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ex-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--gris-clair)}
.ex-row:first-of-type{border-top:none}
.ex-nom{flex:1;font-size:14px;font-weight:600}
.ex-det{font-family:var(--mono);font-size:12px;color:var(--gris);white-space:nowrap}
.ex-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--gris-clair);display:grid;place-items:center;font-size:12px;color:#fff;flex:0 0 auto}
.ex-check[aria-pressed="true"]{background:var(--vert);border-color:var(--vert)}
.prog-bar{height:6px;background:var(--gris-clair);border-radius:4px;overflow:hidden;margin-bottom:10px}
.prog-bar i{display:block;height:100%;background:var(--vert);transition:width .25s}
.btn-ligne{width:100%;padding:11px;border:1px dashed var(--gris-clair);border-radius:8px;color:var(--outremer);font-weight:700;font-size:13px;text-align:center;margin-top:6px}

/* MODE SEANCE (entraînement en cours) */
.seance-chrono{font-family:var(--mono);font-size:36px;font-weight:700;text-align:center;letter-spacing:-0.02em;margin:4px 0 16px}
.seance-carte{background:var(--blanc);border:1px solid var(--gris-clair);border-radius:14px;padding:28px 18px;text-align:center;margin-bottom:16px}
.seance-ex-nom{font-size:22px;font-weight:700;letter-spacing:-0.01em;margin-bottom:8px}
.seance-ex-det{font-family:var(--mono);font-size:14px;color:var(--gris)}

/* CYCLE & REGLES : calendrier et alerte trousse */
.alerte-regles{background:var(--blanc);border:1px solid var(--rouge);border-left:4px solid var(--rouge);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:13.5px}
.alerte-regles strong{display:block;margin-bottom:2px}
.cal-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;font-size:14px}
.cal-hd button{width:32px;height:32px;border-radius:8px;background:var(--blanc);border:1px solid var(--gris-clair);font-size:16px;line-height:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.cal-dow{font-size:10px;color:var(--gris);text-align:center;font-weight:700;text-transform:uppercase;padding:2px 0}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12.5px;border-radius:8px;background:var(--blanc);border:1px solid var(--gris-clair)}
.cal-day.vide{background:transparent;border:none}
.cal-day.today{border-color:var(--encre);border-width:2px;font-weight:700}
.cal-day.regles{background:var(--rouge);color:#fff;border-color:var(--rouge)}
.cal-day.prevu{background:var(--blanc);border:2px dashed var(--outremer);color:var(--outremer);font-weight:700}
.cal-legende{display:flex;gap:14px;font-size:11.5px;color:var(--gris);margin-bottom:18px;flex-wrap:wrap}
.cal-legende .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}
.dot-regles{background:var(--rouge)}
.dot-prevu{border:2px solid var(--outremer);background:var(--blanc)}

/* NUTRITION : répartition des macros */
.macro-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--gris-clair);margin-bottom:10px}
.macro-bar i{display:block;height:100%}
.macro-bar .mp{background:var(--outremer)}
.macro-bar .mg{background:var(--vert)}
.macro-bar .ml{background:var(--signal)}
.macro-legende{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--gris);margin-bottom:16px}
.macro-legende .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}
.dot-p{background:var(--outremer)}
.dot-g{background:var(--vert)}
.dot-l{background:var(--signal)}

/* FEUILLE MODALE (édition) */
.veil{position:fixed;inset:0;background:rgba(20,24,31,.5);display:none;z-index:40}
.veil.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--craie);border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;padding:0 var(--pad) calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.7,.3,1);max-width:820px;margin:0 auto}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet-hd{position:sticky;top:0;background:var(--craie);padding:16px 0 12px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.sheet-hd h2{font-size:16px;font-weight:700}
.sheet-hd button{font-size:14px;color:var(--gris);font-weight:600}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gris);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--gris-clair);border-radius:8px;background:var(--blanc);font-size:16px}
.field textarea{resize:vertical;min-height:64px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sheet-acts{display:flex;gap:8px;margin-top:18px}
.btn-main{flex:1;padding:14px;border-radius:var(--r);background:var(--outremer);color:#fff;font-weight:700;font-size:15px}
.btn-second{padding:14px 16px;border-radius:var(--r);background:var(--blanc);border:1px solid var(--gris-clair);font-weight:700;font-size:15px}
.btn-danger{padding:14px 16px;border-radius:var(--r);background:var(--blanc);border:1px solid var(--gris-clair);color:var(--rouge);font-weight:700;font-size:15px}
.note{font-size:12.5px;color:var(--gris);line-height:1.5;margin-bottom:12px}
.note strong{color:var(--encre)}
.souligne{margin-bottom:8px;border-bottom:1px solid var(--gris-clair);padding-bottom:8px}
.souligne:last-child{border-bottom:none}

/* IMPORT PHOTO / LISTE */
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.modes{display:flex;gap:6px;margin-bottom:14px}
.mode{flex:1;padding:9px;border-radius:8px;border:1px solid var(--gris-clair);background:var(--blanc);font-size:13px;font-weight:600;color:var(--gris)}
.mode[aria-selected="true"]{background:var(--encre);color:#fff;border-color:var(--encre)}
.btn-row{display:flex;gap:8px;margin-bottom:12px}
.btn-row button{flex:1;padding:13px 10px;border-radius:var(--r);background:var(--blanc);border:1px solid var(--gris-clair);font-weight:700;font-size:14px}
.btn-row button.pri{background:var(--outremer);color:#fff;border-color:var(--outremer)}
.diag{font-family:var(--mono);font-size:11px;color:var(--gris);background:var(--blanc);border:1px solid var(--gris-clair);border-radius:6px;padding:8px 10px;margin-bottom:10px;word-break:break-word}
.zone-coller{border:1px dashed var(--gris-clair);border-radius:var(--r);background:var(--blanc);padding:14px;text-align:center;font-size:13px;color:var(--gris);margin-bottom:12px}
.apercu{width:100%;max-height:200px;object-fit:contain;border-radius:8px;background:var(--blanc);border:1px solid var(--gris-clair);margin:12px 0}
.progress{height:4px;background:var(--gris-clair);border-radius:4px;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:var(--outremer);width:0;transition:width .2s}
.prev-row{display:flex;align-items:center;gap:10px;background:var(--blanc);border:1px solid var(--gris-clair);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.prev-row input[type=checkbox]{width:20px;height:20px;flex:0 0 auto}
.prev-row .nm{flex:1;border:none;background:transparent;padding:4px 0;font-size:15px;font-weight:600;min-width:0}
.prev-row .qt{width:64px;border:1px solid var(--gris-clair);border-radius:6px;padding:5px 6px;font-family:var(--mono);font-size:13px;text-align:center}
.prev-row select{width:118px;border:1px solid var(--gris-clair);border-radius:6px;padding:5px 4px;font-size:12px;background:var(--blanc)}
@media(max-width:520px){.prev-row{flex-wrap:wrap}.prev-row .nm{flex:1 0 60%}.prev-row select{width:auto;flex:1}}

/* SAUVEGARDES NOMMEES */
.save-row{display:flex;align-items:center;gap:12px;background:var(--blanc);border:1px solid var(--gris-clair);border-radius:8px;padding:11px 12px;margin-bottom:7px}
.save-row .info{flex:1;min-width:0}
.save-row .nm{font-size:14px;font-weight:600}
.save-row .dt{font-family:var(--mono);font-size:11px;color:var(--gris)}
.save-row button{font-size:12px;font-weight:700;border:1px solid var(--gris-clair);border-radius:16px;padding:5px 11px}
.save-row .rest{color:var(--outremer)}
.save-row .sup{color:var(--rouge)}

/* TOAST */
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140%);background:var(--encre);color:#fff;border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:16px;z-index:60;box-shadow:0 8px 28px rgba(20,24,31,.28);font-size:14px;max-width:calc(100vw - 32px);transition:transform .22s cubic-bezier(.2,.7,.3,1)}
.toast.open{transform:translate(-50%,0)}
.toast button{color:var(--signal);font-weight:700;font-size:14px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* PIED */
.foot{display:flex;gap:8px;justify-content:center;padding:8px 0 24px;flex-wrap:wrap}
.foot button,.foot label{font-size:12px;font-weight:600;color:var(--gris);border:1px solid var(--gris-clair);background:var(--blanc);border-radius:20px;padding:7px 14px;cursor:pointer}
.foot .fort{color:var(--outremer);border-color:var(--outremer)}
.foot input{display:none}

/* ===== STYLES BUDGET ===== */

// ===== OUTILS FRIGO v5 - SYNC + STATS + EXPORT =====

function syncFrigoCoursesAuto() {
  if(!D.frigoSync.autoSuggest) return;
  const maintenant = ajd();
  const dlcAlerte = new Date(maintenant);
  dlcAlerte.setDate(dlcAlerte.getDate() + 3);
  
  D.frigo.forEach(a => {
    if(a.dlc && new Date(a.dlc) < dlcAlerte && new Date(a.dlc) > maintenant) {
      const existing = D.courses.find(c => c.nom.toLowerCase() === a.nom.toLowerCase() && !c.fait);
      if(!existing) {
        D.courses.push({ id:uid(), nom:a.nom+' (stock bas)', fait:false, categorie:a.categorie, frigo:true, dt:iso(maintenant) });
      }
    }
  });
  sauver();
}

function afficherStatsFrigo(){
  const maintenant = ajd();
  let gaspille = 0;
  const expires = [];
  
  D.frigo.forEach(a => {
    if(a.dlc && new Date(a.dlc) < maintenant) {
      gaspille++;
      expires.push(a);
    }
  });
  
  let h = '<div class="sheet-hd"><h2>Stats gaspillage</h2><button data-act="close">Fermer</button></div>';
  h += '<div class="kpis"><div class="kpi"><div class="v">'+gaspille+'</div><div class="l">articles expires</div></div></div>';
  
  if(expires.length > 0) {
    h += '<div class="sec"><div class="sec-hd"><span>Articles expires</span></div>';
    expires.forEach(a => {
      h += '<div class="card"><div class="card-body"><div class="card-title">'+esc(a.nom)+'</div>';
      h += '<div class="card-meta"><span>'+a.categorie+'</span><span class="late">'+a.dlc+'</span></div></div></div>';
    });
    h += '</div>';
  } else {
    h += '<p class="note" style="margin-top:20px">Aucun article expire. Bien joue!</p>';
  }
  
  SHEET.innerHTML = h;
  ouvrirSheet();
}

function togglSyncFrigoCoursesAuto(){
  D.frigoSync.autoSuggest = !D.frigoSync.autoSuggest;
  sauver();
  rendre();
  toast('Sync Frigo-Courses: '+(D.frigoSync.autoSuggest?'ON':'OFF'));
}

function exportPdfFrigo(){
  if(D.frigo.length === 0){
    toast('Frigo vide');
    return;
  }
  
  let txt = 'INVENTAIRE FRIGO\n' + iso(ajd()) + '\n\n';
  D.frigo.forEach(a => {
    txt += '- ' + a.nom + ' (' + a.categorie + ') DLC: ' + a.dlc + '\n';
  });
  
  const win = window.open('about:blank', '', 'height=400,width=600');
  win.document.write('<pre>' + esc(txt) + '</pre>');
  win.document.close();
  win.print();
}

<script>
"use strict";
/* ======================= DONNEES UNIFIEES ======================= */
const CLE = "viePerso.v4";
const CLE_SAVES = "viePerso.saves";
let D = {
  v:4,
  courses:[], rdv:[], evenements:[], taches:[],   // quotidien
  historique:[],                                   // achats archivés (nom, qté, rayon, date, photo)
  sante:[],                                        // santé/forme/sommeil
  programme:[],                                     // sport
  voiture:[],                                       // véhicules/équipement
  frigo:[],                                         // articles frigo {id, nom, dlc, categorie, photo}
  recettes_favorites:[],                           // recettes sauvegardées
  regles:[],                                        // cycles menstruels {id, debut, fin, flux, douleur, notes}
  trousseRegles:null,                               // trousse à emporter {items:[{id,label,coche}]}
  repas:[],
  frigoSync: { autoSuggest: true },              // sync frigo ↔ courses
  stats: { gaspille: 0 },                           // stats gaspillage
  alertes: { expiration: true },                    // notifications
  objectifsNutrition:null                           // {kcal, prot, gluc, lip} objectifs journaliers
};
let domaine = "ensemble";
let onglet = "jour";        // sous-onglet du domaine quotidien
let ongletSante = "journal"; // sous-onglet du domaine santé : "journal", "regles" ou "nutrition"
let calMois = (()=>{ const d=ajd(); d.setDate(1); return d; })(); // mois affiché par le calendrier des règles
let modeMagasin = false;
let ciblePhoto = null;      // {t, id} article en attente d'une photo
let seance = null;          // {progId, index, debutMs, timerId} séance sport en cours

function migrerAncien(){
  // reprise de l'ancien module Vie quotidienne (v2/v3) si présent et v4 absent
  let dejaV4 = false;
  try{ dejaV4 = !!localStorage.getItem(CLE); }catch(e){ dejaV4 = true; /* localStorage indisponible : on ne tente pas de migration */ }
  if(!dejaV4){
    try{
      const anc = localStorage.getItem("vieQuotidienne.v3") || localStorage.getItem("vieQuotidienne.v2");
      if(anc){
        const p = JSON.parse(anc);
        D.courses = p.courses||[]; D.rdv = p.rdv||[]; D.evenements = p.evenements||[]; D.taches = p.taches||[];
      }
    }catch(e){}
  }
  // reprise de l'ancien dashboard v1 (localStorage clé dashboardViePerso) si présent et v4 absent de ces domaines
  try{
    const v1 = localStorage.getItem("dashboardViePerso");
    if(v1 && !D.sante.length && !D.programme.length && !D.voiture.length){
      const p = JSON.parse(v1);
      // santé v1 -> nouveau modèle
      (p.sante||[]).forEach(s => D.sante.push({
        id:uid(), date:s.date||iso(ajd()), type:s.type||"exercice",
        description:s.description||"", duree:String(s.duree||""),
        intensite:s.intensite||"", poids:"", sommeilH:"", notes:s.notes||""
      }));
      // urgences v1 -> tâches priorité haute (fusion demandée)
      (p.urgences||[]).forEach(u => D.taches.push({
        id:uid(), titre:u.titre||"Urgence", notes:u.description||"",
        echeance:u.dateLimite||"", priorite:"haute", recurrence:"aucune",
        fait:(u.statut==="fermé")
      }));
      // voiture v1 -> nouveau modèle
      (p.voiture||[]).forEach(v => D.voiture.push({
        id:uid(), categorie:v.categorie||"voiture", nom:v.nom||"",
        description:v.description||"", dernierEntretien:v.maintenance||"",
        prochainEntretien:v.prochainEntretien||"", km:"", notes:v.notes||""
      }));
      // programme v1 -> nouveau modèle
      (p.programme||[]).forEach(prog => D.programme.push({
        id:uid(), nom:prog.nom||"", objectif:prog.objectif||"",
        frequence:prog.frequence||"", debut:prog.debut||iso(ajd()), fin:prog.fin||"",
        notes:prog.notes||"",
        exercices:(prog.exercices||[]).map(ex => ({
          id:uid(), nom:ex.nom||"", duree:ex.duree||"", sets:ex.sets||"", reps:ex.reps||"",
          notes:ex.notes||"", fait:false
        }))
      }));
      toast("Anciennes données reprises dans le nouveau modèle");
    }
  }catch(e){}
}

function charger(){
  try{
    const b = localStorage.getItem(CLE);
    if(b){
      const p = JSON.parse(b);
      D = { v:4, courses:p.courses||[], rdv:p.rdv||[], evenements:p.evenements||[], taches:p.taches||[],
        historique:p.historique||[],
        sante:p.sante||[], programme:p.programme||[], voiture:p.voiture||[],
        frigo:p.frigo||[], recettes_favorites:p.recettes_favorites||[],
        regles:p.regles||[], trousseRegles:p.trousseRegles||null,
        repas:p.repas||[], objectifsNutrition:p.objectifsNutrition||null,
        depenses:p.depenses||[],
        frigoSync: p.frigoSync || { autoSuggest: true },
        stats: p.stats || { gaspille: 0 },
        alertes: p.alertes || { expiration: true } };
    }
  }catch(e){ console.warn("Données illisibles", e); }
  migrerAncien();
  if(!D.trousseRegles || !Array.isArray(D.trousseRegles.items) || !D.trousseRegles.items.length){
    D.trousseRegles = trousseParDefaut();
  }
  if(!D.objectifsNutrition) D.objectifsNutrition = objectifsNutritionParDefaut();
  sauver();
}
function objectifsNutritionParDefaut(){
  return { kcal:2000, prot:90, gluc:250, lip:70 };
}
function trousseParDefaut(){
  return { items: [
    { id:uid(), label:"Protections (serviettes / tampons / coupe menstruelle)", coche:false },
    { id:uid(), label:"Culotte ou vêtement de rechange", coche:false },
    { id:uid(), label:"Antalgique", coche:false },
    { id:uid(), label:"Bouillotte ou patch chauffant", coche:false },
    { id:uid(), label:"Pochette discrète pour le sac", coche:false },
    { id:uid(), label:"Lingettes", coche:false }
  ] };
}
function sauver(){
  try{ localStorage.setItem(CLE, JSON.stringify(D)); }
  catch(e){ toast("Enregistrement impossible : espace saturé"); }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ======================= UTILITAIRES ======================= */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function ajd(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function deIso(s){ const p=String(s).split("-").map(Number); return new Date(p[0],(p[1]||1)-1,p[2]||1); }
function ecartJours(dateIso){ return dateIso ? Math.round((deIso(dateIso) - ajd())/86400000) : null; }
function libelleDate(dateIso){
  if(!dateIso) return "";
  const e = ecartJours(dateIso);
  if(e===0) return "aujourd'hui";
  if(e===1) return "demain";
  if(e===-1) return "hier";
  const d = deIso(dateIso);
  if(e>1 && e<7) return JOURS[d.getDay()];
  if(e<0) return "il y a " + Math.abs(e) + " j";
  return d.getDate() + " " + MOIS[d.getMonth()].slice(0,4) + ".";
}
function compteARebours(dateIso){
  const e = ecartJours(dateIso);
  if(e===null) return "";
  if(e===0) return "c'est aujourd'hui";
  if(e===1) return "demain";
  if(e<0) return "passé";
  if(e<31) return "dans " + e + " j";
  return "dans " + Math.round(e/30.4) + " mois";
}

function lireDate(txt){
  let t = " " + txt.toLowerCase() + " ", date=null, heure=null, reste=txt;
  const jeter = m => { reste = reste.replace(new RegExp(String(m).trim().replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i")," "); };
  let m = t.match(/\b(\d{1,2})[\/\.](\d{1,2})(?:[\/\.](\d{2,4}))?\b/);
  if(m){
    const an = m[3] ? (m[3].length===2 ? 2000+ +m[3] : +m[3]) : ajd().getFullYear();
    const d = new Date(an, +m[2]-1, +m[1]);
    if(!isNaN(d)){ date = iso(d); jeter(m[0]); }
  }
  if(!date && /\bdemain\b/.test(t)){ const d=ajd(); d.setDate(d.getDate()+1); date=iso(d); jeter("demain"); }
  if(!date && /\baujourd'?hui\b/.test(t)){ date=iso(ajd()); jeter("aujourd'hui"); jeter("aujourdhui"); }
  if(!date){
    for(let i=0;i<7;i++){
      if(new RegExp("\\b"+JOURS[i]+"\\b").test(t)){
        const d=ajd(); let k=(i-d.getDay()+7)%7; if(k===0) k=7;
        d.setDate(d.getDate()+k); date=iso(d); jeter(JOURS[i]); break;
      }
    }
  }
  m = reste.match(/\b(\d{1,2})\s*(?:h|:)\s*(\d{2})?\b/i);
  if(m){
    const H=+m[1], M=m[2]?+m[2]:0;
    if(H<24 && M<60){ heure=String(H).padStart(2,"0")+":"+String(M).padStart(2,"0"); jeter(m[0]); }
  }
  return { date, heure, titre: reste.replace(/\s{2,}/g," ").trim() };
}

const RAYONS = ["Fruits & légumes","Boulangerie","Boucherie","Frais","Épicerie","Surgelés","Boissons","Entretien","Hygiène","Autre"];
const DICO = {
  "Fruits & légumes":["pomme","banane","salade","tomate","carotte","oignon","citron","poire","fraise","courgette","patate","pomme de terre","ail","avocat","concombre","poivron","champignon","orange","raisin","brocoli","haricot","épinard","melon","peche","pêche"],
  "Boulangerie":["pain","baguette","croissant","brioche","viennoiserie","tartine","pain de mie"],
  "Boucherie":["poulet","boeuf","bœuf","steak","porc","jambon","saucisse","agneau","dinde","lardons","viande","escalope","merguez"],
  "Frais":["lait","beurre","yaourt","fromage","crème","creme","oeuf","œuf","comté","comte","emmental","skyr","fromage blanc","raclette","mozzarella"],
  "Épicerie":["pâtes","pates","riz","farine","sucre","sel","huile","café","cafe","thé","conserve","céréales","cereales","biscuit","chocolat","miel","vinaigre","moutarde","confiture","semoule","lentille","poivre","ketchup","mayonnaise"],
  "Surgelés":["glace","surgelé","surgele","pizza","frites","poisson pané","poisson pane","nuggets"],
  "Boissons":["eau","jus","bière","biere","vin","soda","coca","sirop","limonade","perrier","champagne"],
  "Entretien":["lessive","éponge","eponge","sac poubelle","liquide vaisselle","javel","essuie-tout","adoucissant","tablette lave"],
  "Hygiène":["savon","shampoing","dentifrice","papier toilette","gel douche","déodorant","deodorant","rasoir","mouchoir","coton"]
};
function devinerRayon(nom){
  const n = String(nom).toLowerCase();
  for(const r in DICO) if(DICO[r].some(k => n.includes(k))) return r;
  return "Autre";
}
function lireArticle(txt){
  let qte="", nom=String(txt).trim();
  let m = nom.match(/^(\d+(?:[.,]\d+)?\s*(?:kg|g|l|cl|ml|x)?)\s+(.+)$/i);
  if(m){ qte=m[1].trim(); nom=m[2].trim(); }
  else{
    m = nom.match(/^(.+?)\s+(?:x\s*)?(\d+(?:[.,]\d+)?\s*(?:kg|g|l|cl|ml)?)$/i);
    if(m){ nom=m[1].trim(); qte=m[2].trim(); }
  }
  return { nom, qte };
}
const BRUIT = /^(total|sous-total|sous total|tva|ttc|ht|montant|carte|especes|espèces|merci|ticket|caisse|siret|tel|www|http|date|heure|client|magasin|rendu|monnaie|remise|solde)/i;
function analyserListe(brut){
  return String(brut).split(/\r?\n|[;·•]/)
    .map(l => l.replace(/^[\s\-–—*•·▢☐□◦]+/,"").replace(/^\d{1,2}[\.\)]\s+/,"")
      .replace(/\s*\d+[.,]\d{2}\s*(?:€|eur)?\s*$/i,"").replace(/\s{2,}/g," ").trim())
    .filter(l => l.length>1 && l.length<60 && !BRUIT.test(l) && /[a-zàâçéèêëîïôûùüÿœ]/i.test(l))
    .map(l => { const a = lireArticle(l); return { nom:a.nom, qte:a.qte, rayon:devinerRayon(a.nom), garder:true }; })
    .filter(a => a.nom.length>1).slice(0,60);
}

/* ======================= TOAST ======================= */
let annulerFn=null, toastTimer=null;
function toast(msg, undo){
  clearTimeout(toastTimer);
  annulerFn = undo || null;
  const tm = document.getElementById("toastMsg"), tu = document.getElementById("toastUndo"), t = document.getElementById("toast");
  if(!tm) return;
  tm.textContent = msg; tu.hidden = !undo;
  t.classList.add("open");
  toastTimer = setTimeout(()=>{ t.classList.remove("open"); annulerFn=null; }, undo?6000:2600);
}
function brancherToast(){
  document.getElementById("toastUndo").onclick = () => {
    if(annulerFn){ annulerFn(); annulerFn=null; sauver(); rendre(); }
    document.getElementById("toast").classList.remove("open");
  };
}

function telecharger(blob, nom){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=nom; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function ouvrirSheet(){ VEIL.classList.add("open"); requestAnimationFrame(()=>SHEET.classList.add("open")); }
function fermerFeuille(){
  if(seance){ arreterTimerSeance(); seance=null; } // fermeture pendant une séance = séance abandonnée, non comptabilisée
  SHEET.classList.remove("open"); VEIL.classList.remove("open"); SHEET.innerHTML="";
}

/* ======================= SAUVEGARDES NOMMEES (communes à tous les domaines) ======================= */
function lireSaves(){ try{ return JSON.parse(localStorage.getItem(CLE_SAVES)||"[]"); }catch(e){ return []; } }
function ecrireSaves(l){ try{ localStorage.setItem(CLE_SAVES, JSON.stringify(l)); }catch(e){ toast("Espace insuffisant pour la sauvegarde"); } }
function nbElements(d){
  return (d.courses||[]).length+(d.rdv||[]).length+(d.evenements||[]).length+(d.taches||[]).length
    +(d.historique||[]).length+(d.sante||[]).length+(d.programme||[]).length+(d.voiture||[]).length
    +(d.frigo||[]).length+(d.regles||[]).length+(d.repas||[]).length;
}
function ouvrirSauvegardes(){
  const l = lireSaves(), d = new Date();

/* ======================= EVENEMENTS : occurrences ======================= */
function prochaineOccurrence(ev){
  if(!ev.annuel || !ev.date) return ev.date;
  const d = deIso(ev.date), t = ajd();
  let n = new Date(t.getFullYear(), d.getMonth(), d.getDate());
  if(n < t) n = new Date(t.getFullYear()+1, d.getMonth(), d.getDate());
  return iso(n);
}
function ageAtteint(ev){
  if(!ev.annuel || !ev.date || ev.type !== "Anniversaire") return null;
  const n = deIso(prochaineOccurrence(ev)).getFullYear() - deIso(ev.date).getFullYear();
  return (n > 0 && n < 130) ? n : null;
}

function hm(h){ const p=h.split(":").map(Number); return (p[0]*60+p[1])*1000; }
function elementsBoard(){
  const out = [];
  D.rdv.forEach(r => out.push({
    tri:deIso(r.date).getTime() + (r.heure?hm(r.heure):0),
    heure:r.heure||"--:--", libelle:r.titre||"Rendez-vous", genre:"RDV", retard:ecartJours(r.date)<0,
    dom:"quotidien", ong:"rdv" }));
  D.taches.filter(t=>!t.fait && t.echeance).forEach(t => out.push({
    tri:deIso(t.echeance).getTime(), heure:libelleDate(t.echeance),
    libelle:t.titre||"Tâche", genre:t.priorite==="haute"?"Urgent":"Tâche", retard:ecartJours(t.echeance)<0,
    dom:"quotidien", ong:"taches" }));
  D.evenements.forEach(e => {
    const d = prochaineOccurrence(e); if(!d) return;
    const k = ecartJours(d);
    if(k < 0 && !e.annuel){ out.push({tri:deIso(d).getTime(), heure:libelleDate(d), libelle:e.titre||"Événement", genre:"Événem.", retard:true, dom:"quotidien", ong:"evenements"}); return; }
    if(k >= 0 && k <= 30) out.push({ tri:deIso(d).getTime(), heure:"J-"+k, libelle:e.titre||"Événement", genre:"Événem.", retard:false, dom:"quotidien", ong:"evenements" });
  });
  D.voiture.forEach(v => {
    if(!v.prochainEntretien) return;
    const k = ecartJours(v.prochainEntretien);
    if(k!==null && k<=30) out.push({ tri:deIso(v.prochainEntretien).getTime(), heure:k<0?libelleDate(v.prochainEntretien):"J-"+k,
      libelle:(v.nom||"Véhicule")+" — entretien", genre:"Voiture", retard:k<0, dom:"voiture", ong:null });
  });
  {
    const sc = statsCycle();
    if(sc.prochaine){
      const k = ecartJours(sc.prochaine);
      if(k!==null && k<=7) out.push({ tri:deIso(sc.prochaine).getTime(), heure:k<0?libelleDate(sc.prochaine):"J-"+k,
        libelle:"Règles prévues", genre:"Santé", retard:k<0, dom:"sante", ong:null, ongS:"regles" });
    }
  }
  out.sort((a,b)=>a.tri-b.tri);
  const liste = out.filter(o => o.retard || o.tri <= ajd().getTime()+30*86400000).slice(0,6);
  const reste = D.courses.filter(c=>!c.fait).length;
  if(reste) liste.push({ heure:"—", libelle:reste+" article"+(reste>1?"s":"")+" à acheter", genre:"Courses", retard:false, dom:"quotidien", ong:"courses" });
  return { liste, retards: out.filter(o=>o.retard).length };
}

/* ======================= SUGGESTIONS (fréquence d'achat, à partir de l'historique) ======================= */
function cleNom(nom){ return String(nom||"").trim().toLowerCase(); }
/* ---- liens Courses ↔ Santé / Sport : ajouter un article manquant à la liste de courses ---- */
function dejaDansCourses(nom){
  return D.courses.some(c => !c.fait && cleNom(c.nom)===cleNom(nom));
}
function ajouterCoursesDepuis(nom, origine){
  if(!nom) return;
  if(dejaDansCourses(nom)){ toast(nom + " est déjà dans les courses"); return; }
  D.courses.push({ id:uid(), nom:nom, qte:"", rayon:devinerRayon(nom), habituel:false, fait:false, origine:origine||"" });
  sauver(); rendre(); toast(nom + " ajouté aux courses");
}
function tagOrigine(origine){
  if(origine==="sante") return ' <button class="tag-origine" data-act="allerVers" data-dom="sante" data-ongs="regles" title="Ajouté depuis Santé">🌸 Santé</button>';
  if(origine==="programme") return ' <button class="tag-origine" data-act="allerVers" data-dom="programme" title="Ajouté depuis Sport">🏋️ Sport</button>';
  return "";
}
function calculerSuggestions(){
  const groupes = {};
  D.historique.forEach(h => {
    const k = cleNom(h.nom); if(!k || !h.date) return;
    if(!groupes[k]) groupes[k] = [];
    groupes[k].push(h);
  });
  const enCours = {};
  D.courses.filter(c=>!c.fait).forEach(c => { enCours[cleNom(c.nom)] = true; });
  const sugg = [];
  Object.keys(groupes).forEach(k => {
    if(enCours[k]) return;
    const l = groupes[k].slice().sort((a,b)=>a.date.localeCompare(b.date));
    if(l.length < 2) return; // il faut au moins 2 achats pour estimer une fréquence
    let total = 0, n = 0;
    for(let i=1;i<l.length;i++){
      const diff = Math.round((deIso(l[i].date) - deIso(l[i-1].date))/86400000);
      if(diff > 0){ total += diff; n++; }
    }
    if(!n) return;
    const intervalle = total / n;
    if(intervalle < 1.5) return; // trop rapproché pour être fiable
    const dernier = l[l.length-1];
    const joursDepuis = -ecartJours(dernier.date);
    const retard = joursDepuis - intervalle; // > 0 : en retard sur le rythme habituel
    if(retard >= -2){
      sugg.push({ nom:dernier.nom, qte:dernier.qte, rayon:dernier.rayon, photo:dernier.photo||"",
        intervalle: Math.round(intervalle), joursDepuis, retard });
    }
  });
  sugg.sort((a,b)=>b.retard-a.retard);
  return sugg.slice(0,10);
}
function rendreSuggestions(){
  const s = calculerSuggestions();
  if(!s.length) return "";
  return '<div class="sec-hd"><span>Suggestions</span><span class="count">'+s.length+'</span></div><div class="chips">'
    + s.map(x => '<button class="chip sugg" data-act="suggestionAjout" data-nom="'+esc(x.nom)+'" data-qte="'+esc(x.qte)+'" data-rayon="'+esc(x.rayon)+'">'
        + (x.photo?'<img class="chip-th" src="'+x.photo+'" alt="">':'')
        + '+ '+esc(x.nom)
        + '<span class="mono">'+(x.retard>0?"en retard":"tous les "+x.intervalle+"j")+'</span></button>').join("")
    + '</div>';
}

function vueTaches(){
  if(!D.taches.length) return vide("Aucune tâche","Tapez « appeler le garage vendredi ». Priorité haute = urgent.");
  const P = {haute:0,normale:1,basse:2};
  const ouv = D.taches.filter(t=>!t.fait).sort((a,b)=>{
    if(a.priorite!==b.priorite) return P[a.priorite]-P[b.priorite];
    if(!!a.echeance !== !!b.echeance) return a.echeance?-1:1;
    if(a.echeance && b.echeance && a.echeance!==b.echeance) return a.echeance.localeCompare(b.echeance);
    return 0;
  });
  const clos = D.taches.filter(t=>t.fait);
  const urg = ouv.filter(t=>t.priorite==="haute"), autres = ouv.filter(t=>t.priorite!=="haute");
  let h = "";
  if(urg.length){
    h += '<section class="sec alert"><div class="sec-hd"><span>Urgent</span><span class="count">'+urg.length+'</span></div>';
    h += urg.map(t=>{
      const e = t.echeance?ecartJours(t.echeance):null, m=[];
      if(t.echeance) m.push('<span class="'+(e<0?"late":"")+'">'+esc(libelleDate(t.echeance))+'</span>');
      if(t.notes) m.push('<span>'+esc(t.notes)+'</span>');
      return carte({t:"taches",id:t.id,titre:t.titre,prio:t.priorite,late:(e!==null&&e<0),meta:m.join("")});
    }).join("") + '</section>';
  }
  h += '<section class="sec"><div class="sec-hd"><span>À faire</span><span class="count">'+autres.length+'</span></div>';
  h += autres.length ? autres.map(t=>{
    const e = t.echeance?ecartJours(t.echeance):null, m=[];
    if(t.echeance) m.push('<span class="'+(e<0?"late":"")+'">'+esc(libelleDate(t.echeance))+'</span>');
    if(t.recurrence && t.recurrence!=="aucune") m.push('<span>répète : '+esc(t.recurrence)+'</span>');
    if(t.notes) m.push('<span>'+esc(t.notes)+'</span>');
    return carte({t:"taches",id:t.id,titre:t.titre,prio:t.priorite,late:(e!==null&&e<0),meta:m.join("")});
  }).join("") : vide("Rien d'autre en attente","Tout est traité ou urgent.");
  h += '</section>';
  if(clos.length){
    h += '<section class="sec"><div class="sec-hd"><span>Faites</span><button data-act="viderTaches">Effacer</button></div>';
    h += clos.slice(-10).reverse().map(t=>carte({t:"taches",id:t.id,titre:t.titre,done:true})).join("")+'</section>';
  }
  return h;
}

function echapIcs(s){ return String(s).replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n"); }
function exporterIcs(type, id){
  let titre="", date="", heure="", duree="", lieu="", notes="", annuel=false;
  if(type === "rdv"){
    const r = D.rdv.find(x=>x.id===id); if(!r) return;
    titre=r.titre; date=r.date; heure=r.heure; duree=r.duree; lieu=r.lieu; notes=r.notes;
  }else{
    const e = D.evenements.find(x=>x.id===id); if(!e) return;
    titre=e.titre; date=prochaineOccurrence(e); annuel=e.annuel;
    notes=[e.type,e.personne,e.budget,e.notes].filter(Boolean).join(" — ");
  }
  const d0 = deIso(date), p = n => String(n).padStart(2,"0");
  let ligDeb, ligFin;
  if(!heure){
    const d1 = new Date(d0); d1.setDate(d1.getDate()+1);
    ligDeb = "DTSTART;VALUE=DATE:"+iso(d0).replace(/-/g,"");
    ligFin = "DTEND;VALUE=DATE:"+iso(d1).replace(/-/g,"");
  }else{
    const hp = heure.split(":").map(Number);
    const f = new Date(d0); f.setHours(hp[0], hp[1] + (parseInt(duree)||60));
    ligDeb = "DTSTART:"+iso(d0).replace(/-/g,"")+"T"+p(hp[0])+p(hp[1])+"00";
    ligFin = "DTEND:"+iso(f).replace(/-/g,"")+"T"+p(f.getHours())+p(f.getMinutes())+"00";
  }
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Vie Perso//FR","BEGIN:VEVENT",
    "UID:"+id+"@vie-perso", ligDeb, ligFin, "SUMMARY:"+echapIcs(titre||"Événement"),
    annuel ? "RRULE:FREQ=YEARLY" : "", lieu ? "LOCATION:"+echapIcs(lieu) : "",
    notes ? "DESCRIPTION:"+echapIcs(notes) : "", "END:VEVENT","END:VCALENDAR"].filter(Boolean).join("\r\n");
  telecharger(new Blob([ics],{type:"text/calendar"}), String(titre||"evenement").replace(/\W+/g,"-").toLowerCase()+".ics");
  toast("Fichier calendrier téléchargé");
}

const TYPES_SANTE = ["exercice","sommeil","poids","finesse","autre"];
function moyenne7j(champ, filtreType){
  const seuil = ajd(); seuil.setDate(seuil.getDate()-6);
  const l = D.sante.filter(s => s[champ] && deIso(s.date) >= seuil && (!filtreType || s.type===filtreType))
    .map(s => parseFloat(String(s[champ]).replace(",",".")))
    .filter(n => !isNaN(n));
  return l.length ? (l.reduce((a,b)=>a+b,0)/l.length) : null;
}
function serieJours(){
  // nombre de jours consécutifs (jusqu'à aujourd'hui inclus) avec au moins une entrée exercice
  let n = 0, d = new Date(ajd());
  for(let i=0;i<60;i++){
    const has = D.sante.some(s => s.type==="exercice" && s.date===iso(d));
    if(!has) break;
    n++; d.setDate(d.getDate()-1);
  }
  return n;
}

    .reduce((a,s)=>a+(parseInt(s.duree)||0),0);
  const sommeilMoy = moyenne7j("sommeilH","sommeil");
  const serie = serieJours();
  let h = '<div class="kpis">'
    + '<div class="kpi'+(serie>=3?" good":"")+'"><div class="v">'+serie+'</div><div class="l">jours de suite</div></div>'
    + '<div class="kpi"><div class="v">'+semaineExo+'</div><div class="l">séances / 7j</div></div>'

    + '<div class="hint">Type deviné depuis le texte : « sommeil », « poids », sinon exercice.</div>';

  const l = D.sante.slice().sort((a,b)=>b.date.localeCompare(a.date));
  if(!l.length){ h += vide("Aucune entrée","Ajoutez votre première séance ou nuit de sommeil."); return h; }
  const groupes = {};
  l.forEach(s => { if(!groupes[s.date]) groupes[s.date]=[]; groupes[s.date].push(s); });
  Object.keys(groupes).sort().reverse().slice(0,21).forEach(d => {
    h += '<section class="sec"><div class="sec-hd"><span>'+esc(libelleDate(d)==="aujourd'hui"||libelleDate(d)==="hier"?libelleDate(d):(deIso(d).getDate()+" "+MOIS[deIso(d).getMonth()]))+'</span></div>';

/* ======================= CYCLE & RÈGLES ======================= */
const TYPES_FLUX = ["léger","moyen","abondant"];
const TYPES_DOULEUR = ["aucune","légère","modérée","forte"];
const CYCLE_DEFAUT = 28; // moyenne usuelle d'un cycle menstruel, utilisée tant que l'historique perso est insuffisant
const DUREE_DEFAUT = 5;  // durée usuelle des règles, idem

function cycleOuvert(){
  const l = D.regles.slice().sort((a,b)=>a.debut.localeCompare(b.debut));
  const dernier = l[l.length-1];
  return (dernier && !dernier.fin) ? dernier : null;
}
function statsCycle(){
  const l = D.regles.filter(c=>c.debut).slice().sort((a,b)=>a.debut.localeCompare(b.debut));
  const longueurs = [];
  for(let i=1;i<l.length;i++){
    const diff = Math.round((deIso(l[i].debut) - deIso(l[i-1].debut))/86400000);
    if(diff>0 && diff<90) longueurs.push(diff);
  }
  const recentes = longueurs.slice(-6);
  const moyenneCycle = recentes.length ? Math.round(recentes.reduce((a,b)=>a+b,0)/recentes.length) : null;
  const durees = l.filter(c=>c.fin).map(c=>Math.round((deIso(c.fin)-deIso(c.debut))/86400000)+1).filter(n=>n>0 && n<20);
  const dureeRecentes = durees.slice(-6);
  const dureeMoyenne = dureeRecentes.length ? Math.round(dureeRecentes.reduce((a,b)=>a+b,0)/dureeRecentes.length) : null;
  const dernier = l[l.length-1];
  // Tant qu'il n'y a pas assez d'historique perso (2 cycles pour la longueur, 1 avec fin pour la durée),
  // on complète avec une moyenne usuelle pour que la projection démarre dès le premier enregistrement.
  const cycleUtilise = moyenneCycle || CYCLE_DEFAUT;
  const dureeUtilisee = dureeMoyenne || DUREE_DEFAUT;
  const estime = moyenneCycle===null || dureeMoyenne===null;
  let prochaine = null;
  if(dernier){
    const d = deIso(dernier.debut); d.setDate(d.getDate()+cycleUtilise); prochaine = iso(d);
  }
  const regulier = recentes.length>=3 ? (Math.max(...recentes)-Math.min(...recentes) <= 7) : null;
  return { moyenneCycle, dureeMoyenne, cycleUtilise, dureeUtilisee, estime, dernier, prochaine, regulier, nbCycles:l.length };
}
function reglesDebut(){
  if(cycleOuvert()){ toast("Un cycle est déjà en cours"); return; }
  D.regles.push({ id:uid(), debut:iso(ajd()), fin:"", flux:"moyen", douleur:"aucune", notes:"" });
  (D.trousseRegles.items||[]).forEach(it => it.coche=false);
  sauver(); rendre(); toast("Règles enregistrées — bon courage");

/* ---- calendrier ---- */
function joursDansPeriode(debut, fin){
  const out=[]; let d=deIso(debut); const f=fin?deIso(fin):d;
  let garde=0;
  while(d<=f && garde<400){ out.push(iso(d)); d.setDate(d.getDate()+1); garde++; }
  return out;
}
function joursRegles(){
  // Cycle en cours (pas de fin enregistrée) : on colore en rouge du début à aujourd'hui,
  // pas seulement le jour de début, pour que le calendrier suive l'écoulement des règles au jour le jour.
  const s = new Set();
  const auj = iso(ajd());
  D.regles.forEach(c => {
    if(!c.debut) return;
    const fin = c.fin || (c.debut <= auj ? auj : c.debut);
    joursDansPeriode(c.debut, fin).forEach(j=>s.add(j));
  });
  return s;
}
function joursPrevus(stats){
  // Projette les fenêtres de règles à venir en répétant le cycle (moyenne perso dès 2 cycles connus,
  // sinon moyenne usuelle de 28 j) pour que le calendrier reste juste quel que soit le mois affiché,
  // dès le tout premier cycle enregistré.
  const s = new Set();
  if(!stats.dernier) return s;
  const limite = new Date(calMois.getFullYear(), calMois.getMonth()+2, 0); // couvre le mois affiché + marge
  let debut = deIso(stats.dernier.debut);
  debut.setDate(debut.getDate()+stats.cycleUtilise);
  let garde = 0;
  while(debut <= limite && garde < 60){ // 60 cycles ~ 5 ans, filet de sécurité
    const debutIso = iso(debut);
    const fin = new Date(debut); fin.setDate(fin.getDate()+stats.dureeUtilisee-1);
    joursDansPeriode(debutIso, iso(fin)).forEach(j=>s.add(j));
    debut.setDate(debut.getDate()+stats.cycleUtilise);
    garde++;
  }
  return s;
}
function rendreCalendrier(stats){
  const reel = joursRegles(), prevu = joursPrevus(stats);
  const premier = new Date(calMois.getFullYear(), calMois.getMonth(), 1);
  const decalage = premier.getDay();
  const nbJours = new Date(calMois.getFullYear(), calMois.getMonth()+1, 0).getDate();
  let h = '<div class="cal-hd"><button data-act="calPrev" aria-label="Mois précédent">‹</button><span>'
    + esc(MOIS[calMois.getMonth()]+" "+calMois.getFullYear()) + '</span>'
    + '<button data-act="calNext" aria-label="Mois suivant">›</button></div>';
  h += '<div class="cal-grid">';
  ["D","L","M","M","J","V","S"].forEach(j => h += '<div class="cal-dow">'+j+'</div>');
  for(let i=0;i<decalage;i++) h += '<div class="cal-day vide"></div>';
  for(let n=1;n<=nbJours;n++){
    const d = new Date(calMois.getFullYear(), calMois.getMonth(), n);
    const ds = iso(d);
    const cls = ["cal-day"];
    if(ds===iso(ajd())) cls.push("today");
    if(reel.has(ds)) cls.push("regles");
    else if(prevu.has(ds)) cls.push("prevu");
    h += '<div class="'+cls.join(" ")+'">'+n+'</div>';
  }
  h += '</div>';
  h += '<div class="cal-legende"><span><i class="dot dot-regles"></i>Règles enregistrées</span><span><i class="dot dot-prevu"></i>Prévision</span></div>';
  return h;
}

/* ======================= NUTRITION (lien Frigo ↔ Programme) ======================= */
const FACTEUR_KCAL_MIN = { "faible":5, "modérée":8, "haute":11 }; // estimation grossière kcal/min selon l'intensité de la séance
function macrosPourPortion(item, grammes){
  const g = parseFloat(String(grammes).replace(",","."))||0;
  const f = champ => (item[champ]!==undefined && item[champ]!==null && item[champ]!=="") ? Math.round(parseFloat(item[champ]) * g/100 * 10)/10 : 0;
  return { kcal:f("kcal100"), prot:f("prot100"), gluc:f("gluc100"), lip:f("lip100"), sel:f("sel100") };
}
function calculsNutritionJour(dateIso){
  const d = dateIso || iso(ajd());
  const repasJour = D.repas.filter(r=>r.date===d);
  const somme = champ => Math.round(repasJour.reduce((a,r)=>a+(parseFloat(r[champ])||0),0));
  const depense = D.sante.filter(s=>s.type==="exercice" && s.date===d)
    .reduce((a,s)=>a + (parseInt(s.duree)||0) * (FACTEUR_KCAL_MIN[s.intensite]||7), 0);
  return { date:d, repasJour, kcal:somme("kcal"), prot:somme("prot"), gluc:somme("gluc"), lip:somme("lip"), depense:Math.round(depense) };
}
function vueRepasJour(c){
  let h = '<div class="sec-hd" style="margin-top:20px"><span>Aujourd\'hui</span><span class="count">'+c.repasJour.length+'</span></div>';
  h += c.repasJour.length ? c.repasJour.map(r => carte({
      t:"repas", id:r.id, titre:r.nom, check:false,
      meta:'<span class="mono">'+Math.round(r.kcal||0)+' kcal</span><span>P '+Math.round(r.prot||0)+'g · G '+Math.round(r.gluc||0)+'g · L '+Math.round(r.lip||0)+'g'+(r.sel ? ' · Sel '+r.sel+'g' : '')+'</span>'+(r.origine==="frigo"?' <span class="tag-origine" style="cursor:default">🧊 Frigo</span>':""),
      acts:'<button class="icon-btn" title="Supprimer" data-act="delRepas" data-id="'+r.id+'">✕</button>'
    })).join("") : vide("Aucun repas enregistré","Ajoutez un repas depuis le frigo ou manuellement ci-dessus.");
  return h;
}
function vueHistoriqueRepas(){
  const jours = {};
  D.repas.forEach(r => { if(r.date===iso(ajd())) return; if(!jours[r.date]) jours[r.date]=[]; jours[r.date].push(r); });
  const dates = Object.keys(jours).sort().reverse().slice(0,14);
  if(!dates.length) return "";
  let h = '<div class="sec-hd" style="margin-top:20px"><span>Jours précédents</span></div>';
  h += dates.map(d => {
    const l = jours[d];

    + '<div class="kpi'+(serie>=3?" good":"")+'"><div class="v">'+serie+'</div><div class="l">jours de suite</div></div>'

    + '<div class="kpi"><div class="v">'+dureeSemaine+'</div><div class="l">min / 7j</div></div>'

    const total = prog.exercices.length, faits = prog.exercices.filter(e=>e.fait).length;
    const pct = total ? Math.round(faits/total*100) : 0;
    const seances = seancesDuProgramme(prog.id);
    const faitAujourdhui = seances.some(s=>s.date===iso(ajd()));

      + '<button class="icon-btn" data-act="editProgramme" data-id="'+prog.id+'">✎</button></div>'
      + '<div class="prog-meta">'
      + (prog.objectif?'<span>'+esc(prog.objectif)+'</span>':"")
      + (prog.frequence?'<span>'+semaineProg+'/'+esc(prog.frequence)+' séances cette semaine</span>':"")
      + (derniere?'<span>dernière séance '+esc(libelleDate(derniere.date))+'</span>':(prog.debut?'<span>créé le '+esc(libelleDate(prog.debut))+'</span>':""))
      + '</div>';

    if(materiel.length){
      h += '<div class="chips" style="margin-bottom:10px">' + materiel.map(it => {
        const dans = dejaDansCourses(it);
        return dans
          ? '<button class="chip sugg" data-act="allerVers" data-dom="quotidien" data-ong="courses" title="Voir dans les courses">✓ '+esc(it)+'</button>'
          : '<button class="chip" data-act="courseDepuisProgramme" data-nom="'+esc(it)+'" title="Ajouter aux courses">🛒 '+esc(it)+'</button>';
      }).join("") + '</div>';

      h += '<div class="prog-bar"><i style="width:'+pct+'%"></i></div>';
      h += '<p class="hint" style="margin-bottom:8px">'+faits+' / '+total+' exercices préparés pour la prochaine séance</p>';
      h += prog.exercices.map(ex => '<div class="ex-row">'
        + '<button class="ex-check" aria-pressed="'+(ex.fait?"true":"false")+'" data-act="toggleExercice" data-p="'+prog.id+'" data-e="'+ex.id+'">'+(ex.fait?"✓":"")+'</button>'
        + '<span class="ex-nom">'+esc(ex.nom||"Exercice")+'</span>'
        + '<span class="ex-det">'+[ex.sets&&ex.reps?ex.sets+'×'+ex.reps:"", ex.duree?ex.duree+' min':""].filter(Boolean).join(" · ")+'</span>'
        + '</div>').join("");
    } else {
      h += vide("Aucun exercice","Ouvrez « Gérer » pour en ajouter avant de démarrer une séance.");
    }
    h += '<div class="sheet-acts" style="margin-top:12px">'
      + '<button class="btn-main" data-act="demarrerSeance" data-id="'+prog.id+'"'+(total?"":" disabled")+'>▶ Démarrer la séance</button>'

    h += '</div>';
  });
  return h;
}

/* ======================= MODE SEANCE (démarrer / suivre un entraînement) ======================= */
function demarrerSeance(progId){
  const o = D.programme.find(x=>x.id===progId); if(!o) return;
  if(!o.exercices.length){ toast("Ajoutez au moins un exercice avant de démarrer"); return; }
  o.exercices.forEach(e=>e.fait=false);
  sauver();
  seance = { progId:progId, index:0, debutMs:Date.now(), timerId:null };
  rendreSeance();
  ouvrirSheet();
  seance.timerId = setInterval(majChronoSeance, 1000);
}
function arreterTimerSeance(){
  if(seance && seance.timerId){ clearInterval(seance.timerId); seance.timerId=null; }
}
function majChronoSeance(){
  const el = document.getElementById("seanceChrono");
  if(!el || !seance) return;
  const s = Math.floor((Date.now()-seance.debutMs)/1000);
  el.textContent = String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function rendreSeance(){
  if(!seance) return;
  const o = D.programme.find(x=>x.id===seance.progId);
  if(!o || !o.exercices.length){ fermerFeuille(); return; }
  const total = o.exercices.length;
  seance.index = Math.max(0, Math.min(seance.index, total-1));
  const ex = o.exercices[seance.index];
  const faits = o.exercices.filter(e=>e.fait).length;
  const dernier = seance.index===total-1;
  SHEET.innerHTML = '<div class="sheet-hd"><h2>'+esc(o.nom||"Séance")+'</h2><button data-act="close">Fermer</button></div>'
    + '<div class="seance-chrono" id="seanceChrono">00:00</div>'
    + '<div class="prog-bar" style="margin-bottom:14px"><i style="width:'+Math.round(faits/total*100)+'%"></i></div>'
    + '<p class="hint" style="text-align:center;margin-bottom:14px">Exercice '+(seance.index+1)+' / '+total+'</p>'
    + '<div class="seance-carte">'
      + '<div class="seance-ex-nom">'+esc(ex.nom||"Exercice")+'</div>'
      + '<div class="seance-ex-det">'+esc([ex.sets&&ex.reps?ex.sets+" séries × "+ex.reps:"", ex.duree?ex.duree+" min":""].filter(Boolean).join(" · ")||"—")+'</div>'
      + (ex.notes?'<div class="hint" style="margin-top:10px">'+esc(ex.notes)+'</div>':"")
    + '</div>'
    + '<div class="sheet-acts">'
      + '<button class="btn-second" data-act="seancePrec"'+(seance.index===0?" disabled":"")+'>◂ Précédent</button>'
      + '<button class="btn-main" data-act="seanceValider" data-e="'+ex.id+'">'+(ex.fait?"✓ Fait — suivant":(dernier?"Marquer fait":"Marquer fait et suivant"))+'</button>'
    + '</div>'
    + (dernier?"":'<button class="btn-ligne" data-act="seanceSuivant">Passer cet exercice ›</button>')
    + '<div class="sheet-acts" style="margin-top:18px"><button class="btn-danger" data-act="terminerSeance">Terminer la séance</button></div>';
}
function seanceValider(exId){
  if(!seance) return;
  const o = D.programme.find(x=>x.id===seance.progId); if(!o) return;
  const ex = o.exercices.find(x=>x.id===exId);
  if(ex) ex.fait = true;
  sauver();
  if(seance.index < o.exercices.length-1) seance.index++;
  rendreSeance();
}
function seanceSuivant(){
  if(!seance) return;
  const o = D.programme.find(x=>x.id===seance.progId); if(!o) return;
  if(seance.index < o.exercices.length-1) seance.index++;
  rendreSeance();
}
function seancePrecedent(){
  if(!seance) return;
  if(seance.index>0) seance.index--;
  rendreSeance();
}
function terminerSeance(){
  if(!seance) return;
  const o = D.programme.find(x=>x.id===seance.progId);
  if(!o){ arreterTimerSeance(); seance=null; fermerFeuille(); return; }
  const dureeMin = Math.max(1, Math.round((Date.now()-seance.debutMs)/60000));
  const faits = o.exercices.filter(e=>e.fait).length, total = o.exercices.length;
  D.sante.push({ id:uid(), date:iso(ajd()), type:"exercice", description:o.nom||"Séance", duree:String(dureeMin),
    intensite:"", poids:"", sommeilH:"", notes:faits+"/"+total+" exercices", progId:o.id });
  arreterTimerSeance(); seance=null;
  fermerFeuille(); sauver(); rendre();
  toast("Séance terminée — "+dureeMin+" min enregistrées dans Santé");
}

  const o = D.programme.find(x=>x.id===progId); if(!o) return;

      : '<p class="note">Aucune séance enregistrée pour ce programme.</p>');
  ouvrirSheet();
}

/* ======================= VOITURE / EQUIPEMENT ======================= */
function vueDomaineVoiture(){
  const alerteJ30 = D.voiture.filter(v => { const k=v.prochainEntretien?ecartJours(v.prochainEntretien):null; return k!==null && k<=30; });
  let h = "";
  if(alerteJ30.length){
    h += '<section class="sec alert"><div class="sec-hd"><span>Entretien à prévoir</span><span class="count">'+alerteJ30.length+'</span></div>';
    h += alerteJ30.map(v=>{
      const k = ecartJours(v.prochainEntretien);
      return carte({ t:"voiture", id:v.id, titre:v.nom||"Véhicule", check:false, late:k<0,
        meta:'<span class="'+(k<0?"late":"")+'">'+esc(k<0?libelleDate(v.prochainEntretien):compteARebours(v.prochainEntretien))+'</span><span>'+esc(v.categorie)+'</span>' });
    }).join("") + '</section>';
  }
  h += '<div class="foot" style="justify-content:flex-start;padding:0 0 16px"><button class="fort" data-act="nouvelleVoiture">+ Ajouter un véhicule / équipement</button></div>';
  const reste = D.voiture.filter(v => !alerteJ30.includes(v));
  if(!D.voiture.length) return h + vide("Aucune entrée","Ajoutez un véhicule ou un équipement à suivre.");
  if(reste.length){
    h += '<section class="sec"><div class="sec-hd"><span>Suivi</span><span class="count">'+reste.length+'</span></div>';
    h += reste.map(v=>{
      const meta = [];
      meta.push('<span>'+esc(v.categorie)+'</span>');
      if(v.dernierEntretien) meta.push('<span>dernier : '+esc(libelleDate(v.dernierEntretien))+'</span>');
      if(v.prochainEntretien) meta.push('<span>prochain : '+esc(libelleDate(v.prochainEntretien))+'</span>');
      if(v.km) meta.push('<span class="mono">'+esc(v.km)+' km</span>');
      return carte({ t:"voiture", id:v.id, titre:v.nom||"Sans nom", check:false, meta:meta.join("") });
    }).join("") + '</section>';
  }
  return h;
}

function redimensionnerPhoto(file, cb){
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 480;
      let w = img.width, h = img.height;
      if(w >= h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else { if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      try{ cb(cv.toDataURL("image/jpeg", 0.6)); }catch(err){ cb(null); }
    };
    img.onerror = () => cb(null);
    img.src = ev.target.result;
  };
  reader.onerror = () => cb(null);
  reader.readAsDataURL(file);
}
function fotoChoisie(e){
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  const cible = ciblePhoto; ciblePhoto = null;
  if(!f || !cible) return;
  if(!/^image\//.test(f.type||"")){ toast("Ce fichier n'est pas une image"); return; }

  redimensionnerPhoto(f, dataUrl => {
    if(!dataUrl){ toast("Photo illisible"); return; }
    const liste = D[cible.t];
    const o = liste && liste.find(x=>x.id===cible.id);
    if(!o) return;
    o.photo = dataUrl;
    sauver();
    // si la feuille d'édition est ouverte sur cet article, on la rafraîchit pour montrer l'aperçu
    if(SHEET.classList.contains("open")){
      if(cible.t==="historique") ouvrirFeuilleHistorique(cible.id);
      else if(cible.t==="frigo") ouvrirFeuilleFrigo(cible.id);
    }
    else rendre();
    toast("Photo ajoutée");
  });
}

let produitsScannes = [];

// Date ISO à J+n (DLC par défaut)
function isoDansJours(n){ const d = ajd(); d.setDate(d.getDate() + n); return iso(d); }

// ===== NOUVELLES FONCTIONS (OPTIMISATIONS v5) =====

// Sync Frigo ↔ Courses : si article frigo proche DLC, suggérer achat
function syncFrigoCoursesAuto() {
  if(!D.frigoSync.autoSuggest) return;
  const maintenant = ajd();
  const dlcAlerte = new Date(maintenant);
  dlcAlerte.setDate(dlcAlerte.getDate() + 3); // Alerte à J-3
  
  D.frigo.forEach(a => {
    if(a.dlc && new Date(a.dlc) < dlcAlerte && new Date(a.dlc) > maintenant) {
      // Article expire dans 3j → suggérer achat du même dans courses
      const existing = D.courses.find(c => c.nom.toLowerCase() === a.nom.toLowerCase() && !c.fait);
      if(!existing) {
        D.courses.push({ id:uid(), nom:a.nom+' (stock bas)', fait:false, categorie:a.categorie, frigo:true, dt:iso(maintenant) });
      }
    }
  });
  sauver();
}

// Stats : articles expirés ce mois
function calculStatsGaspillage() {
  const mois = iso(ajd()).slice(0,7); // YYYY-MM
  let gaspille = 0;
  const expires = D.frigo.filter(a => {
    if(a.dlc && a.dlc.slice(0,7) === mois && new Date(a.dlc) < ajd()) {
      gaspille++;
      return true;
    }
    return false;
  });
  D.stats.gaspille = gaspille;
  D.stats.mois = mois;
  return expires;
}

// Nutrition : calcul agrégé semaine
function calculNutritionSemaine() {
  const maintenant = ajd();
  const debut = new Date(maintenant);
  debut.setDate(debut.getDate() - 7);
  
  const repasHebdo = D.repas.filter(r => {
    const d = new Date(r.date);
    return d >= debut && d <= maintenant;
  });
  
  const totaux = {
    kcal: Math.round(repasHebdo.reduce((s,r) => s + (r.kcal||0), 0)),
    prot: Math.round(repasHebdo.reduce((s,r) => s + (r.prot||0), 0) * 10) / 10,
    lip: Math.round(repasHebdo.reduce((s,r) => s + (r.lip||0), 0) * 10) / 10,
    gluc: Math.round(repasHebdo.reduce((s,r) => s + (r.gluc||0), 0) * 10) / 10
  };
  
  return { repasHebdo, totaux, moy: {
    kcal: Math.round(totaux.kcal / 7),
    prot: Math.round((totaux.prot / 7) * 10) / 10,
    lip: Math.round((totaux.lip / 7) * 10) / 10,
    gluc: Math.round((totaux.gluc / 7) * 10) / 10
  }};
}

// Alertes : carence potentielle
function detecterCarences() {
  const nut = calculNutritionSemaine();
  const alertes = [];
  
  if(nut.moy.prot < 50) alertes.push({ type:'prot', msg:'⚠️ Protéines insuffisantes cette semaine (<50g/j)', seuil:50 });
  if(nut.moy.kcal < 1500) alertes.push({ type:'kcal', msg:'⚠️ Calories insuffisantes (<1500 kcal/j)', seuil:1500 });
  if(nut.moy.lip < 30) alertes.push({ type:'lip', msg:'⚠️ Lipides insuffisants (<30g/j)', seuil:30 });
  
  return alertes;
}

// ---- Scan d'une image unique ----
function scannerPhotoCode(inputId) {
  const input = document.getElementById(inputId || 'scanPhoto');
  const file = input.files?.[0];
  if(!file) return;

  toast("🔍 Analyse du code-barres...");

  const reader = new FileReader();
  reader.onload = (e) => {
    decoderImageCode(e.target.result).then(code => {
      if(!code) {
        toast("❌ Aucun code lisible. Photo plus nette et cadrée sur le code.");
        return;
      }
      chercherProduitOFF(code).then(p => {
        produitsScannes = [p];
        afficherProduitsScannes();
      });
    });
  };
  reader.onerror = () => toast("❌ Erreur lecture image");
  reader.readAsDataURL(file);
}

// ---- Saisie manuelle du code ----
function scannerCodeManuel() {
  const code = document.getElementById('codeManuel')?.value.trim();
  if(!code) { toast("Entrez un code-barres"); return; }
  toast("🔍 Recherche du produit...");
  chercherProduitOFF(code).then(p => {
    produitsScannes = [p];
    afficherProduitsScannes();
  });
}

// ---- Scan vidéo multi-produits ----
function scannerVideoCodes() {
  const file = document.getElementById('scanVideo').files?.[0];
  if(!file) return;

  produitsScannes = [];
  const prog = document.getElementById('scanProgress');
  if(prog) prog.style.display = 'block';
  toast("🎥 Lecture de la vidéo...");

  const video = document.createElement('video');
  video.preload = 'auto'; video.muted = true; video.playsInline = true;
  video.src = URL.createObjectURL(file);

  video.onloadedmetadata = () => {
    const duree = video.duration;
    if(!isFinite(duree) || duree === 0) {
      toast("❌ Vidéo illisible sur ce navigateur.");
      if(prog) prog.style.display = 'none';
      return;
    }
    const pas = Math.max(0.3, duree / 120);
    const instants = [];
    for(let t = 0; t < duree; t += pas) instants.push(t);
    analyserImagesVideo(video, instants);
  };
  video.onerror = () => {
    toast("❌ Impossible de lire cette vidéo.");
    if(prog) prog.style.display = 'none';
  };
}

async function analyserImagesVideo(video, instants) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const codes = new Set();
  const bar = document.getElementById('scanBar');
  const txt = document.getElementById('scanProgressTxt');

  for(let i = 0; i < instants.length; i++) {
    if(bar) bar.style.width = Math.round((i / instants.length) * 100) + '%';
    if(txt) txt.textContent = 'Image ' + (i+1) + '/' + instants.length + ' — ' + codes.size + ' code(s) trouvé(s)';
    try {
      await allerAInstant(video, instants[i]);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const code = await decoderImageCode(canvas.toDataURL('image/jpeg', 0.85));
      if(code) codes.add(code);
    } catch(err) { console.warn('Image ignorée', err); }
  }

  if(bar) bar.style.width = '100%';
  URL.revokeObjectURL(video.src);

  if(codes.size === 0) {
    toast("❌ Aucun code lisible. Filmez plus près, plus stable, mieux éclairé.");
    const prog = document.getElementById('scanProgress');
    if(prog) prog.style.display = 'none';
    return;
  }

  if(txt) txt.textContent = codes.size + ' code(s) — recherche des produits...';

  produitsScannes = [];
  for(const code of codes) {
    produitsScannes.push(await chercherProduitOFF(code));
  }
  afficherProduitsScannes();
}

function allerAInstant(video, temps) {
  return new Promise((resolve, reject) => {
    const onSeek = () => { video.removeEventListener('seeked', onSeek); resolve(); };
    video.addEventListener('seeked', onSeek);
    setTimeout(() => { video.removeEventListener('seeked', onSeek); reject(new Error('timeout')); }, 3000);
    video.currentTime = temps;
  });
}

function decoderImageCode(dataUrl) {
  return new Promise((resolve) => {
    if(typeof Quagga === 'undefined') { resolve(null); return; }
    Quagga.decodeSingle({
      decoder: { readers: ["ean_reader","ean_8_reader","code_128_reader","upc_reader"] },
      locate: true,
      src: dataUrl
    }, (result) => resolve(result && result.codeResult ? result.codeResult.code : null));
  });
}

// Clé Google Cloud Vision (restreinte au domaine nunudroppeur-design.github.io + à l'API Vision uniquement)
/* ===== Clé API Google Vision : stockée en local uniquement, jamais dans le code source ===== */
const CLE_VISION_API = 'viePerso.visionApiKey';
function getVisionApiKey(){
  return localStorage.getItem(CLE_VISION_API) || '';
}
function definirVisionApiKey(valeur){
  const v = (valeur||'').trim();
  if(!v){ localStorage.removeItem(CLE_VISION_API); return; }
  localStorage.setItem(CLE_VISION_API, v);
}
function ouvrirReglagesApiKey(messageIntro){
  const cleActuelle = getVisionApiKey();
  let h = '<h3>🔑 Clé API Google Vision</h3>';
  if(messageIntro) h += '<p class="note">'+esc(messageIntro)+'</p>';
  h += '<p class="note">Nécessaire pour la lecture de tickets et l\'identification de produit par photo. Cette clé reste uniquement sur cet appareil : elle n\'est jamais écrite dans le code, seulement envoyée à Google lors d\'un scan.</p>';
  h += '<div class="form-group"><label>Clé API Google Vision</label><input type="text" id="inputVisionApiKey" placeholder="AIzaSy..." value="'+esc(cleActuelle)+'"></div>';
  h += '<div style="display:flex;gap:8px;margin-top:14px">';
  h += '<button class="btn btn-primary" onclick="validerReglagesApiKey()">Enregistrer</button>';
  if(cleActuelle) h += '<button class="btn btn-secondary" onclick="definirVisionApiKey(\'\');fermerFeuille();toast(\'Clé supprimée\')">Supprimer</button>';
  h += '</div>';
  SHEET.innerHTML = h;
  ouvrirSheet();
}
function validerReglagesApiKey(){
  const val = document.getElementById('inputVisionApiKey').value;
  definirVisionApiKey(val);
  fermerFeuille();
  toast(val.trim() ? '✅ Clé API enregistrée sur cet appareil' : 'Clé API vidée');
}

// ---- Identification d'un produit par photo (Google Cloud Vision - LABEL_DETECTION) ----
function identifierProduitParPhoto(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.capture = 'environment';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => { await analyserPhotoProduit(ev.target.result); };
    reader.readAsDataURL(file);
  };
  input.click();
}

async function analyserPhotoProduit(imageDataUrl){
  const cleApi = getVisionApiKey();
  if(!cleApi){ ouvrirReglagesApiKey('Configure ta clé API pour identifier un produit par photo.'); return; }
  toast('📸 Analyse de la photo...');
  try{
    const base64 = imageDataUrl.split(',')[1];
    const res = await fetch('https://vision.googleapis.com/v1/images:annotate?key=' + cleApi, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        requests: [{ image: { content: base64 }, features: [{ type: 'LABEL_DETECTION', maxResults: 8 }] }]
      })
    });
    const data = await res.json();
    if(data.responses?.[0]?.error){
      toast('❌ Erreur Vision API : ' + data.responses[0].error.message);
      return;
    }
    const labels = (data.responses?.[0]?.labelAnnotations || []).filter(l => l.score >= 0.5).slice(0, 6);
    if(!labels.length){ toast('❌ Rien de reconnaissable sur cette photo'); return; }
    afficherSuggestionsPhoto(labels, imageDataUrl);
  }catch(err){
    console.error('Erreur Vision API (label detection):', err);
    toast('❌ Erreur réseau lors de l\'analyse');
  }
}

function afficherSuggestionsPhoto(labels, imageDataUrl){
