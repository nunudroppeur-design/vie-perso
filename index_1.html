async function chercherProduitOFF(code) {
  // ===== 1. VÉRIFIER BASE LOCALE D'ABORD =====
  if(BASE_EAN_LOCAL[code]) {
    const prod = BASE_EAN_LOCAL[code];
    return {
      code: code,
      nom: prod.nom,
      marque: prod.marque,
      categorie: prod.categorie,
      image: prod.image,
      trouve: true,
      source: 'local',
      kcal100: prod.kcal100,
      prot100: prod.prot100,
      gluc100: prod.gluc100,
      lip100: prod.lip100,
      sel100: prod.sel100 ?? null
    };
  }

  // ===== 2. SINON, CHERCHER SUR OFF =====
  try {
    const res = await fetch('https://world.openfoodfacts.org/api/v0/product/' + code + '.json');
    const data = await res.json();
    if(data.status === 0) {
      return { code:code, nom:'Produit inconnu ('+code+')', marque:'—', categorie:'Autre', image:'', trouve:false,
        kcal100:null, prot100:null, gluc100:null, lip100:null };
    }
    const p = data.product;
    return mapperProduitOFFDepuisJSON(p, code);
  } catch(err) {
    return { code:code, nom:'Erreur réseau ('+code+')', marque:'—', categorie:'Autre', image:'', trouve:false };
  }
}

// Convertit un objet produit renvoyé par l'API Open Food Facts (recherche par code OU par nom)
// vers le format utilisé par le frigo. Centralisé ici pour que le scan EAN et la recherche par
// nom donnent exactement les mêmes champs (kcal100, prot100...).
function mapperProduitOFFDepuisJSON(p, code){
  const nutr = p.nutriments || {};
  const num = v => (typeof v === "number" && !isNaN(v)) ? Math.round(v*10)/10 : null;
  return {
    code: code || p.code || '',
    nom: p.product_name_fr || p.product_name || 'Produit sans nom',
    marque: p.brands || '',
    categorie: categorieDepuisOFF(p),
    image: p.image_url || p.image_front_url || p.image_front_small_url || '',
    trouve: true,
    source: 'OFF',
    // valeurs nutritionnelles pour 100 g/mL, quand Open Food Facts les fournit
    kcal100: num(nutr['energy-kcal_100g']) ?? (num(nutr['energy_100g']) ? Math.round(nutr['energy_100g']/4.184) : null),
    prot100: num(nutr['proteins_100g']),
    gluc100: num(nutr['carbohydrates_100g']),
    lip100: num(nutr['fat_100g']),
    // sel en g/100g : OFF fournit soit salt_100g directement, soit sodium_100g (sel = sodium * 2.5)
    sel100: num(nutr['salt_100g']) ?? (num(nutr['sodium_100g']) ? Math.round(nutr['sodium_100g']*2.5*100)/100 : null)
  };
}

// ---- Recherche par NOM de produit (texte libre, sans code-barres) ----
let resultatsRechercheNom = [];

async function rechercherProduitParNom(queryDirecte){
  const champ = document.getElementById('rechNom');
  const q = (queryDirecte || (champ ? champ.value.trim() : '')).trim();
  if(!q){ toast("Entrez un nom de produit"); return; }
  toast("🔍 Recherche « " + q + " »...");
  try{
    const url = 'https://world.openfoodfacts.org/cgi/search.pl?search_terms=' + encodeURIComponent(q)
      + '&search_simple=1&action=process&json=1&page_size=15'
      + '&fields=code,product_name,product_name_fr,brands,image_url,image_front_url,image_front_small_url,nutriments,categories_tags';
    const res = await fetch(url);
    const data = await res.json();
    const produits = (data.products || [])
      .filter(p => p.product_name || p.product_name_fr)
      .map(p => mapperProduitOFFDepuisJSON(p, p.code));
    if(!produits.length){
      SHEET.innerHTML = '<div class="sheet-hd"><h2>🔍 Aucun résultat</h2><button data-act="close">Fermer</button></div>'
        + '<p class="hint" style="color:#666;font-size:13px;margin-bottom:14px">Rien trouvé pour « ' + esc(q) + ' » dans Open Food Facts.</p>'
        + '<button class="btn-main" style="width:100%" onclick="ouvrirSaisieManuelleArticle(\'' + esc(q).replace(/'/g,"\\'") + '\')">✍️ Ajouter quand même avec ce nom</button>';
      ouvrirSheet();
      return;
    }
    resultatsRechercheNom = produits;
    afficherResultatsRechercheNom(q);
  }catch(err){
    console.error('Erreur recherche OFF par nom:', err);
    toast("❌ Erreur réseau lors de la recherche");
  }
}

function afficherResultatsRechercheNom(q){
  let h = '<div class="sheet-hd"><h2>🔍 Résultats pour « ' + esc(q) + ' »</h2><button data-act="close">Fermer</button></div>'
    + '<p class="hint" style="color:#666;font-size:12px;margin-bottom:10px">Touchez un produit pour le sélectionner.</p>'
    + '<div style="max-height:400px;overflow-y:auto">';
  resultatsRechercheNom.forEach((p, i) => {
    h += '<div style="padding:10px;margin-bottom:8px;border:1px solid #ddd;border-radius:6px;display:flex;gap:10px;align-items:center;cursor:pointer" onclick="choisirProduitRecherche(' + i + ')">'
      + (p.image ? '<img src="' + esc(p.image) + '" style="width:48px;height:48px;object-fit:contain;border-radius:4px;background:#f5f5f5">' : '<div style="width:48px;height:48px;background:#f5f5f5;border-radius:4px;flex-shrink:0"></div>')
      + '<div style="flex:1">'
      + '<div style="font-weight:600;font-size:14px">' + esc(p.nom) + '</div>'
      + (p.marque ? '<div style="font-size:12px;color:#666">' + esc(p.marque) + '</div>' : '')
      + '<div style="font-size:11px;color:#999">' + (p.kcal100 != null ? p.kcal100 + ' kcal/100g' : 'Valeurs nutritionnelles non fournies') + '</div>'
      + '</div></div>';
  });
  h += '</div>';
  SHEET.innerHTML = h;
  ouvrirSheet();
}

function choisirProduitRecherche(i){
  const p = resultatsRechercheNom[i];
  if(!p) return;
  produitsScannes = [p];

function categorieDepuisOFF(p) {
  const tags = (p.categories_tags || []).join(' ').toLowerCase();
  if(/dairy|milk|cheese|yogurt|yaourt|fromage|lait|beurre|cream/.test(tags)) return 'Produits laitiers';
  if(/fruit|pomme|banane|orange/.test(tags)) return 'Fruits';
  if(/vegetable|legume|salad|tomato/.test(tags)) return 'Légumes';
  if(/meat|fish|poultry|viande|poisson|charcuterie|egg|oeuf/.test(tags)) return 'Protéines';
  if(/beverage|drink|juice|water|boisson|jus|soda/.test(tags)) return 'Boissons';
  if(/bread|pasta|rice|cereal|pain|pate|riz|biscuit|snack/.test(tags)) return 'Épicerie';
  return 'Autre';
}

function validerProduitsScannes(avecCourses) {
  let n = 0;
  produitsScannes.forEach((p, i) => {
    const qte = document.querySelector('.scan-qte[data-i="'+i+'"]')?.value.trim() || '';
    const dlc = document.querySelector('.scan-dlc[data-i="'+i+'"]')?.value || isoDansJours(7);

    const existe = D.frigo.find(x => x.nom.toLowerCase() === p.nom.toLowerCase());
    if(existe) {
      existe.qte = qte; existe.dlc = dlc;
      if(p.kcal100!=null) existe.kcal100 = p.kcal100;
      if(p.prot100!=null) existe.prot100 = p.prot100;
      if(p.gluc100!=null) existe.gluc100 = p.gluc100;
      if(p.lip100!=null) existe.lip100 = p.lip100;
      if(p.sel100!=null) existe.sel100 = p.sel100;
    } else {
      D.frigo.push({ id:uid(), nom:p.nom, qte:qte, categorie:p.categorie, dlc:dlc, photo:p.image||'', code:p.code,
        kcal100:p.kcal100 ?? "", prot100:p.prot100 ?? "", gluc100:p.gluc100 ?? "", lip100:p.lip100 ?? "", sel100:p.sel100 ?? "" });
    }
    if(avecCourses) syncFrigoVersCourses(p.nom, qte);
    n++;
  });

  sauver(); rendre(); fermerFeuille();
  produitsScannes = [];
  toast(n + " produit(s) ajouté(s)" + (avecCourses ? " au frigo et aux courses" : " au frigo"));
}

function afficherRecettes(){
  const ingredients_frigo = D.frigo.map(a => a.nom.toLowerCase().split(' ')).flat();
  
  // Tri par pertinence : priorité aux articles proches de la DLC
  const urgent = D.frigo.filter(a => { const j=ecartJours(a.dlc); return j!==null && j<=3; }).map(a=>a.nom.toLowerCase());
  
  const scored = RECETTES.map(r => {
    let score = 0;
    r.ingredients.forEach(ing => {
      const ing_lower = ing.toLowerCase();
      if(urgent.some(u => u.includes(ing_lower))) score += 3;
      else if(ingredients_frigo.some(f => f.includes(ing_lower))) score += 1;
    });
    return { ...r, score: score };
  }).filter(r => r.score > 0).sort((a,b) => b.score - a.score).slice(0,8);

  SHEET.innerHTML = '<div class="sheet-hd"><h2>Recettes suggérées</h2><button data-act="close">Fermer</button></div>'
    + '<p class="hint">Basées sur les articles du frigo. Les recettes en haut utilisent les articles proches de la DLC.</p>'

      scored.map((r,i) => '<div class="prog-card">'
      + '<div class="prog-hd"><h3 style="margin:0">'+esc(r.titre)+'</h3></div>'
      + '<div class="prog-meta"><span>'+esc(r.temps)+'</span><span>'+esc(r.difficulte)+'</span></div>'

/* ===== FONCTIONS OCR TICKET ===== */
let ocrEnCours = false;

async function scannerTicket(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    
    const reader = new FileReader();
    reader.onload = async (ev) => {
      await traiterTicketOCR(ev.target.result);
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

async function traiterTicketOCR(imageData){
  const cleApi = getVisionApiKey();
  if(!cleApi){ ouvrirReglagesApiKey('Configure ta clé API pour scanner un ticket.'); return; }
  ocrEnCours = true;
  
  // Créer une barre de progression
  const progressDiv = document.createElement('div');
  progressDiv.id = 'ocr-progress';
  progressDiv.style.cssText = `
    position:fixed;top:0;left:0;right:0;z-index:10000;
    background:var(--outremer);color:white;
    padding:12px;text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
  `;
  progressDiv.innerHTML = `
    <div style="margin-bottom:8px;font-weight:700;font-size:14px">
      📸 Analyse de la photo...
    </div>
    <div style="background:rgba(255,255,255,0.3);height:4px;border-radius:2px;overflow:hidden">
      <div id="ocr-bar" style="background:white;height:100%;width:0;transition:width 0.3s ease"></div>
    </div>
  `;
  document.body.appendChild(progressDiv);
  
  const progressBar = document.getElementById('ocr-bar');
  let progress = 0;
  
  const progressInterval = setInterval(() => {
    progress += Math.random() * 30;
    if(progress > 85) progress = 85;
    progressBar.style.width = progress + '%';
  }, 200);
  
  try {
    const base64 = imageData.split(',')[1];
    const res = await fetch('https://vision.googleapis.com/v1/images:annotate?key=' + cleApi, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        requests: [{
          image: { content: base64 },
          features: [{ type: 'DOCUMENT_TEXT_DETECTION' }]
        }]
      })
    });
    progressBar.style.width = '85%';
    const data = await res.json();
    if(data.responses?.[0]?.error){
      throw new Error(data.responses[0].error.message || 'Erreur Vision API');
    }
    const text = data.responses?.[0]?.fullTextAnnotation?.text || '';
    console.log('[OCR] Texte brut reconnu (Vision API) :', text); // diagnostic si le parsing échoue encore
    if(!text.trim()){
      throw new Error('Aucun texte détecté sur la photo');
    }

    progressBar.style.width = '90%';
    
    // Étape 2 : Extraire les articles
    const articles = extraireArticlesTicket(text);
    progressBar.style.width = '95%';
    
    // Étape 3 : Afficher les résultats
    afficherResultatOCR(articles, text);
    progressBar.style.width = '100%';
    
    // Attendre un peu et retirer la barre
    setTimeout(() => {
      clearInterval(progressInterval);
      progressDiv.remove();
    }, 500);
    
  } catch(err) {
    console.error('Erreur OCR:', err);
    clearInterval(progressInterval);
    progressDiv.remove();
    toast('❌ Erreur lors de la lecture du ticket : ' + (err.message || ''));
  } finally {
    ocrEnCours = false;
  }
}

function extraireArticlesTicket(texte){
  const articles = [];

  let texteNettoy = texte.replace(/[\u00A0]/g, ' ');
  const lignesToutes = texteNettoy.split('\n').map(l => l.trim()).filter(l => l);

  const sansAccents = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  // Mots/en-têtes à ignorer (comparés sans accents, et après retrait d'une puce/astérisque
  // éventuelle en tête de ligne). Couvre les tickets français ET des formats plus génériques.
  const ignorer = /^(TOTAL|MONTANT|TVA|DONT|HT\b|TTC|EURO\b|TICKET|CAISSE|CAISSIER|CLIENT|HOTE|DATE|HEURE|NUMERO|NOMBRE|MERCI|BIENVENUE|SOUS.?TOTAL|REMISE|DISCOUNT|RECU|FACTURE|ANNULE|CANCELLED|ENCAISSEMENT|REGLEMENT|PAIEMENT|TRANSACTION|SOLDE|PRIX|DESIGNATION|NOM (STE|PRODUITS?)|QTE\b|LOGO|MODE|DEJA|PAYE|ESPECE|CARTE|CHEQUE|CHANGE|BONNE|NUIT|JOUR|A BIENTOT|VOUS AVEZ ETE SERVI|LUNDI|MARDI|MERCREDI|JEUDI|VENDREDI|SAMEDI|DIMANCHE)/i;
  const lignesSymboles = /^[-=*\s_\.]+$/;
  const enleverPuce = l => l.replace(/^[*•·▪]+\s*/, '');

  // Lignes jamais un article, détectées où qu'apparaisse le motif dans la ligne (pas juste en tête) :
  // date/heure, adresse (code postal + ville, téléphone), détail "prix au kg", mentions légales
  // (SIRET, certification caisse NF525) qui contiennent souvent un nombre à décimales trompeur.
  const ligneNonPertinente = ligne =>
    /\d{1,2}\/\d{1,2}\/\d{2,4}/.test(ligne) ||             // date jj/mm/aaaa
    /\d{1,2}\s*:\s*\d{2}(\s*:\s*\d{2})?/.test(ligne) ||     // heure hh:mm(:ss)
    /\.(com|fr|tn|net|org)\b/i.test(ligne) ||               // adresse web / réseau social
    /\bkg\s*x\s*\d/i.test(ligne) || /eur\s*\/\s*kg/i.test(ligne) || // détail "0.170 kg x 32.10 Eur/kg"
    /\bSIRET\b|\bSIREN\b|\bNAF\b|\bAPE\b/i.test(ligne) ||   // identifiants légaux d'entreprise
    /NF-?525\b|\bMAGIC\b/i.test(ligne) ||                   // certification logiciel de caisse
    /^\d{9,10}$/.test(ligne) ||                             // numéro de téléphone seul
    /^\d{5}\s+[A-ZÀ-Ÿ]/.test(ligne);                        // code postal + ville

  // Nombre "monétaire" : 2 OU 3 décimales, pour couvrir aussi bien les tickets en euros
  // (2 décimales) que les tickets en dinars/millimes (3 décimales, ex: Tunisie).
  const reNombre = /\d+[.,]\d{2,3}/;
  const reNombreG = () => new RegExp(reNombre.source, 'g');
  const extraireNombres = ligne => {
    const m = ligne.match(reNombreG());
    return m ? m.map(s => parseFloat(s.replace(',', '.'))) : [];
  };
  // "Purement numérique" = aucune lettre dans la ligne (juste un ou des nombres, espaces, symboles).
  const estPurementNumerique = ligne =>
    !/[a-zA-ZÀ-ÿ\u00C0-\u017F]/.test(ligne) && extraireNombres(ligne).length > 0;

  const nettoyerNom = nom => nom
    .replace(/^\d+\s*[xX×*]\s*/i, '')
    .replace(/^[\(\[].*?[\)\]]\s*/i, '')
    .replace(/^(?=[A-Z0-9]*\d)[A-Z0-9]{6,}\s*/, '')
    .replace(/^[\*|•·▪\-–—]+\s*/, '')
    .replace(/[*#@!|]/g, '')
    .trim();

  const ajouterArticle = (nomBrut, montant, qte) => {
    const nom = nettoyerNom(nomBrut);
    if(!(nom && montant > 0 && montant < 5000 && nom.length > 1)) return false;
    if(!/[a-zA-ZÀ-ÿ\u00C0-\u017F]/.test(nom)) return false;
    if(ignorer.test(sansAccents(nom))) return false; // ex: nom réduit à "TTC" après retrait du nombre
    const existe = articles.some(a =>
      a.nom.toLowerCase() === nom.toLowerCase() ||
      (a.nom.substring(0,12).toLowerCase() === nom.substring(0,12).toLowerCase() && Math.abs(a.montant - montant) < 0.3)
    );
    if(existe) return false;
    articles.push({ nom: nom.substring(0,100), montant, qte: qte||1, id: Math.random().toString(36).substr(2,9), source:'ocr' });
    return true;
  };

  const utiles = lignesToutes
    .filter(l => !ligneNonPertinente(l) && !lignesSymboles.test(l) && l.length >= 2)
    .filter(l => !ignorer.test(sansAccents(enleverPuce(l))));
  const dejaTraitee = new Array(utiles.length).fill(false);

  // PASSE A : lignes "classiques" où le nom ET le prix sont sur la MÊME ligne
  // (ex: "Produit 5,99€", ou "Article 1  1  11,00€" en 3 colonnes sur une seule ligne).
  utiles.forEach((ligne, idx) => {
    if(estPurementNumerique(ligne)) return; // laissé à la passe B
    const nb = extraireNombres(ligne);
    if(nb.length === 0) return; // ligne de texte pur (nom potentiel) : laissée à la passe B

    let ok = false, m;
    m = ligne.match(/^(.+?)\s+(\d{1,3})\s+(\d+[.,]\d{2,3})\s*€?\s*$/);
    if(m && !/[.,]/.test(m[2])) ok = ajouterArticle(m[1], parseFloat(m[3].replace(',', '.')), parseInt(m[2],10)||1);

    if(!ok){
      m = ligne.match(new RegExp('(' + reNombre.source + ')\\s*€?\\s*$'));
      if(m) ok = ajouterArticle(ligne.replace(m[0], ''), parseFloat(m[1].replace(',', '.')), 1);
    }
    if(!ok){
      m = ligne.match(new RegExp('^(' + reNombre.source + ')\\s*€?\\s*'));
      if(m) ok = ajouterArticle(ligne.replace(m[0], ''), parseFloat(m[1].replace(',', '.')), 1);
    }
    if(!ok && nb.length){
      ok = ajouterArticle(ligne.replace(reNombreG(), ''), nb[0], 1);
    }
    dejaTraitee[idx] = ok;
  });

  // PASSE B : nom sur une ou deux lignes de texte pur (une seule ligne de continuation
  // autorisée, pour gérer un nom coupé en 2 par l'OCR type "CANNELLE"/"ORANGE", sans pour
  // autant fusionner tout un bloc d'en-tête de ticket), suivi de ligne(s) purement numériques
  // (quantité / prix unitaire / total séparés).
  let i = 0;
  while(i < utiles.length){
    if(dejaTraitee[i]){ i++; continue; }
    const ligne = utiles[i];
    if(extraireNombres(ligne).length === 0 && !estPurementNumerique(ligne)){
      let nomAccum = ligne;
      let j = i + 1;
      let continuations = 0;
      while(j < utiles.length && !dejaTraitee[j] && continuations < 1 &&
            extraireNombres(utiles[j]).length === 0 && !estPurementNumerique(utiles[j])){
        nomAccum += ' ' + utiles[j];
        j++; continuations++;
      }
      const nombresBloc = [];
      while(j < utiles.length && !dejaTraitee[j] && estPurementNumerique(utiles[j]) && nombresBloc.length < 4){
        nombresBloc.push(...extraireNombres(utiles[j]));
        dejaTraitee[j] = true;
        j++;
      }
      if(nombresBloc.length){
        const montant = nombresBloc[nombresBloc.length - 1]; // le dernier nombre du bloc = le total de la ligne
        let qte = 1;
        if(nombresBloc.length >= 2 && Number.isInteger(nombresBloc[0]) && nombresBloc[0] < 100 && nombresBloc[0] > 0) qte = nombresBloc[0];
        ajouterArticle(nomAccum, montant, qte);
      }
      i = j;
    } else {
      i++;
    }
  }

  articles.sort((a, b) => b.montant - a.montant);
  return articles.slice(0, 100);
}

function validerTicketOCRAvecEdition(articlesJson){
  try {
    let articles = JSON.parse(articlesJson);
    
    // Récupérer les valeurs éditées depuis les inputs
    articles.forEach((a, idx) => {
      const input = document.getElementById('montant-' + idx);
      if(input){
        a.montant = parseFloat(input.value) || a.montant;
      }
    });
    
    validerTicketOCR(JSON.stringify(articles));
  } catch(err) {
    console.error('Erreur validation:', err);
    toast('❌ Erreur lors de la validation');
  }
}

function validerTicketOCR(articlesJson){
  try {
    const articles = JSON.parse(articlesJson);
    const total = articles.reduce((s, a) => s + (a.montant * a.qte), 0);
    const date = iso(new Date());
    
    // Ajouter au budget comme dépense "Courses"
    D.depenses.push({
      id: Math.random().toString(36).substr(2,9),
      montant: total,
      categorie: 'alimentaire',
      description: 'Ticket caisse (' + articles.length + ' articles)',
      date: date,
      ean: null,
      articles: articles // Stocker les détails des articles
    });
    
    // Ajouter articles à la liste de courses
    articles.forEach(a => {
      const existing = D.courses.find(c => c.nom.toLowerCase().includes(a.nom.toLowerCase().substring(0,15)));
      if(!existing && a.montant < 100){ // Ne pas ajouter les gros achats en doublons
        D.courses.push({
          id: uid(),
          nom: a.nom,
          fait: true, // Marquer comme acheté
          qte: a.qte,
          rayon: devinerRayon(a.nom),
          habituel: false,
          prixUnitaire: (a.montant / a.qte).toFixed(2)
        });
      }
    });
    
    sauver();
    fermerFeuille();
    rendre();
    toast('✓ Ticket ajouté au budget et à la liste');
  } catch(e) {
    toast('❌ Erreur lors du traitement');
    console.error(e);
  }
}

function afficherAlertesBudget(){
  const periode = periodeBudget === 'mois-comp' ? 'mois' : periodeBudget;
  const depenses = obtenirDepensesPeriodeBudget(periode);
  const total = depenses.reduce((s,d) => s + d.montant, 0);
  const budget = periode === 'mois' ? 2000 : 500;
  const pourcent = (total / budget) * 100;

  let html = '';
  if(pourcent > 100) html += `<div class="alert-banner"><div><strong>⚠️ Budget dépassé !</strong><br>Vous avez dépensé ${total.toFixed(2)}€ sur ${budget}€ (${pourcent.toFixed(0)}%)</div></div>`;
  else if(pourcent > 80) html += `<div class="alert-banner warn"><div><strong>⚡ Budget à ${pourcent.toFixed(0)}%</strong><br>Dépenses : ${total.toFixed(2)}€ / ${budget}€</div></div>`;

  const plusChere = depenses.reduce((max, d) => d.montant > (max?.montant || 0) ? d : max, null);
  if(plusChere && plusChere.montant > 200) html += `<div class="alert-banner warn"><div><strong>💸 Dépense importante</strong><br>${plusChere.description} - ${plusChere.montant.toFixed(2)}€</div></div>`;

  document.getElementById('alertDuJour').innerHTML = html;
}

function afficherKpisBudget(){
  const periode = periodeBudget === 'mois-comp' ? 'mois' : periodeBudget;
  const depenses = obtenirDepensesPeriodeBudget(periode);
  const total = depenses.reduce((s,d) => s + d.montant, 0);
  const moyen = depenses.length > 0 ? (total / depenses.length).toFixed(2) : '0.00';
  const budget = periode === 'mois' ? 2000 : 500;
  const reste = Math.max(0, budget - total).toFixed(2);

  let html = `
    <div class="kpi ${total > budget ? 'bad' : total > budget*0.8 ? 'warn' : 'good'}">
      <div class="v">${total.toFixed(2)}€</div>
      <div class="l">Total</div>
      <div class="sub">Budget: ${budget}€</div>
    </div>
    <div class="kpi">
      <div class="v">${depenses.length}</div>
      <div class="l">Transactions</div>
      <div class="sub">Avg: ${moyen}€</div>
    </div>
    <div class="kpi ${reste <= 0 ? 'bad' : reste < budget*0.2 ? 'warn' : 'good'}">
      <div class="v">${reste}€</div>
      <div class="l">Disponible</div>
    </div>
  `;
  document.getElementById('kpiSynthese').innerHTML = html;
}

        <button class="icon-btn" onclick="supprimerDepenseBudget('${d.id}')" title="Supprimer">🗑️</button>
      </div>
    </div>`;
  });
  document.getElementById('listDepenses').innerHTML = html;
}

function obtenirDepensesPeriodeBudget(periode){
  const maintenant = new Date();
  const debut = new Date();
  if(periode === 'semaine') debut.setDate(maintenant.getDate() - maintenant.getDay());
  else if(periode === 'mois') debut.setDate(1);
  else if(periode === 'mois-comp'){ debut.setMonth(maintenant.getMonth() - 1); debut.setDate(1); }
  return D.depenses.filter(d => { const dateD = new Date(d.date); return dateD >= debut && dateD <= maintenant; });
}

function obtenirDepensesParCategorieBudget(periode){
  const depenses = obtenirDepensesPeriodeBudget(periode);
  const par = {};
  Object.keys(CATEGORIES_BUDGET).forEach(c => par[c] = 0);
  depenses.forEach(d => { if(par[d.categorie] !== undefined) par[d.categorie] += d.montant; });
  return par;
}

function obtenirTotalParMoisBudget(){
  const parMois = {};
  D.depenses.forEach(d => {
    const [annee, mois] = d.date.split('-');
    const cle = `${mois}/${annee}`;
    parMois[cle] = (parMois[cle] || 0) + d.montant;
  });
  return parMois;
}

function changerPeriodeBudget(p){
  periodeBudget = p;
  document.querySelectorAll('#tabsBudget .tab').forEach(t => t.removeAttribute('aria-selected'));
  document.querySelector(`#tabsBudget [data-period="${p}"]`).setAttribute('aria-selected','true');
  rendreTableauBudget();
}

function ajouterDepenseBudget(){
  const montant = parseFloat(document.getElementById('inputMontant').value);
  const categorie = document.getElementById('inputCategorie').value;
  const description = document.getElementById('inputDesc').value;
  const date = document.getElementById('inputDate').value;
  const ean = document.getElementById('inputEan').value;

  if(!montant || montant <= 0 || !categorie || !date){ toast('Remplissez montant, catégorie et date'); return; }

  D.depenses.push({
    id: Math.random().toString(36).substr(2,9),
    montant: montant,
    categorie: categorie,
    description: description || 'Sans détail',
    date: date,
    ean: ean || null
  });

  sauver();
  reinitForm();
  rendreTableauBudget();
  toast('✓ Dépense ajoutée');
}

function supprimerDepenseBudget(id){
  if(confirm('Supprimer cette dépense ?')){
    D.depenses = D.depenses.filter(d => d.id !== id);
    sauver();
    rendreTableauBudget();
    toast('Dépense supprimée');
  }
}

function reinitForm(){
  document.getElementById('inputMontant').value = '';
  document.getElementById('inputCategorie').value = '';

  document.getElementById('inputEan').value = '';

/* ======================= EXPORT / IMPORT FICHIER GLOBAL ======================= */
function brancherExportImport(){
  document.getElementById("btnExport").onclick = () => {
    telecharger(new Blob([JSON.stringify(D,null,2)],{type:"application/json"}), "vie-perso-"+iso(new Date())+".json");
    toast("Fichier téléchargé");
  };
  document.getElementById("fileImport").onchange = e => {
    const f = e.target.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ev => {
      try{
        const p = JSON.parse(ev.target.result);
        if(!p || typeof p!=="object") throw new Error("format");
        const avant = JSON.parse(JSON.stringify(D));
        D = { v:4, courses:p.courses||[], rdv:p.rdv||[], evenements:p.evenements||[], taches:p.taches||[],
          historique:p.historique||[],
          sante:p.sante||[], programme:p.programme||[], voiture:p.voiture||[],
          frigo:p.frigo||[], recettes_favorites:p.recettes_favorites||[],
          regles:p.regles||[], trousseRegles:p.trousseRegles||null,
          repas:p.repas||[], objectifsNutrition:p.objectifsNutrition||null,
          depenses:p.depenses||[] };
        if(!D.trousseRegles || !Array.isArray(D.trousseRegles.items) || !D.trousseRegles.items.length){
          D.trousseRegles = trousseParDefaut();
        }
        if(!D.objectifsNutrition) D.objectifsNutrition = objectifsNutritionParDefaut();
        sauver(); rendre();
        toast("Fichier restauré", () => { D = avant; });
      }catch(err){ toast("Fichier illisible : ce n'est pas une sauvegarde valide"); }
    };
    fr.readAsText(f); e.target.value = "";
  };
}

      const f = items[i].getAsFile();
      if(f){ e.preventDefault(); traiterImage(f); return; }

});

// ===== OUTILS FRIGO v5 - SYNC + STATS + EXPORT =====

function syncFrigoCoursesAuto() {
  if(!D.frigoSync.autoSuggest) return;
  const maintenant = ajd();
  const dlcAlerte = new Date(maintenant);
  dlcAlerte.setDate(dlcAlerte.getDate() + 3);
  
  D.frigo.forEach(a => {
    if(a.dlc && new Date(a.dlc) < dlcAlerte && new Date(a.dlc) > maintenant) {
      const existing = D.courses.find(c => c.nom.toLowerCase() === a.nom.toLowerCase() && !c.fait);
      if(!existing) {
        D.courses.push({ id:uid(), nom:a.nom+' (stock bas)', fait:false, categorie:a.categorie, frigo:true, dt:iso(maintenant) });
      }
    }
  });
  sauver();
}

function afficherStatsFrigo(){
  const maintenant = ajd();
  let gaspille = 0;
  const expires = [];
  
  D.frigo.forEach(a => {
    if(a.dlc && new Date(a.dlc) < maintenant) {
      gaspille++;
      expires.push(a);
    }
  });
  
  let h = '<div class="sheet-hd"><h2>Stats gaspillage</h2><button data-act="close">Fermer</button></div>';
  h += '<div class="kpis"><div class="kpi"><div class="v">'+gaspille+'</div><div class="l">articles expires</div></div></div>';
  
  if(expires.length > 0) {
    h += '<div class="sec"><div class="sec-hd"><span>Articles expires</span></div>';
    expires.forEach(a => {
      h += '<div class="card"><div class="card-body"><div class="card-title">'+esc(a.nom)+'</div>';
      h += '<div class="card-meta"><span>'+a.categorie+'</span><span class="late">'+a.dlc+'</span></div></div></div>';
    });
    h += '</div>';
  } else {
    h += '<p class="note" style="margin-top:20px">Aucun article expire. Bien joue!</p>';
  }
  
  SHEET.innerHTML = h;
  ouvrirSheet();
}

function togglSyncFrigoCoursesAuto(){
  D.frigoSync.autoSuggest = !D.frigoSync.autoSuggest;
  sauver();
  rendre();
  toast('Sync Frigo-Courses: '+(D.frigoSync.autoSuggest?'ON':'OFF'));
}

function exportPdfFrigo(){
  if(D.frigo.length === 0){
    toast('Frigo vide');
    return;
  }
  
  let txt = 'INVENTAIRE FRIGO\n' + iso(ajd()) + '\n\n';
  D.frigo.forEach(a => {
    txt += '- ' + a.nom + ' (' + a.categorie + ') DLC: ' + a.dlc + '\n';
  });
  
  const win = window.open('about:blank', '', 'height=400,width=600');
  win.document.write('<pre>' + esc(txt) + '</pre>');
  win.document.close();
  win.print();
}

      .then(reg => {
        console.log('✓ Service Worker enregistré');
        
        // Vérifier les mises à jour
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if(newWorker.state === 'installed' && navigator.serviceWorker.controller) {
              toast('Mise à jour disponible - Recharger la page');
            }
          });
        });
        
        // Vérifier les mises à jour toutes les heures
        setInterval(() => reg.update(), 3600000);

  });
}
